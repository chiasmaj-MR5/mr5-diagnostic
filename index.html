<!doctype html>
<title>Four Quotients Diagnostic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600&amp;family=Instrument+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
  :root {
    --bg: #F6F3EF;
    --surface: #FDFBF8;
    --surface-2: #EFEAE3;
    --ink: #26221E;
    --ink-2: #5C554D;
    --ink-3: #8A827A;
    --line: #DDD6CC;
    --line-strong: #C4BBAE;
    --accent: #B4432A;
    --accent-ink: #FFFFFF;
    --accent-soft: rgba(180, 67, 42, 0.10);
    --q-iq: #2F62B8;
    --q-eq: #188A6B;
    --q-pasq: #B03318;
    --q-cuq: #B67A10;
    --track: #E7E1D8;
    --grid: #E3DCD2;
    --shadow: 0 1px 2px rgba(38, 34, 30, 0.05), 0 8px 28px rgba(38, 34, 30, 0.07);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #191817;
      --surface: #211F1E;
      --surface-2: #2A2725;
      --ink: #ECE7E0;
      --ink-2: #B3ACA3;
      --ink-3: #7D766D;
      --line: #363330;
      --line-strong: #4A4540;
      --accent: #E0664A;
      --accent-ink: #1B1210;
      --accent-soft: rgba(224, 102, 74, 0.13);
      --q-iq: #5C8BE0;
      --q-eq: #2EA187;
      --q-pasq: #BC3F26;
      --q-cuq: #C8841F;
      --track: #2E2B29;
      --grid: #302D2B;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 28px rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #191817;
    --surface: #211F1E;
    --surface-2: #2A2725;
    --ink: #ECE7E0;
    --ink-2: #B3ACA3;
    --ink-3: #7D766D;
    --line: #363330;
    --line-strong: #4A4540;
    --accent: #E0664A;
    --accent-ink: #1B1210;
    --accent-soft: rgba(224, 102, 74, 0.13);
    --q-iq: #5C8BE0;
    --q-eq: #2EA187;
    --q-pasq: #BC3F26;
    --q-cuq: #C8841F;
    --track: #2E2B29;
    --grid: #302D2B;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 28px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 2.5rem 1.25rem 5rem; position: relative; }

  .lang-switch {
    position: absolute; top: 2.3rem; right: 1.25rem;
    display: flex; border: 1px solid var(--line-strong); border-radius: 999px;
    overflow: hidden; background: var(--surface);
  }
  .lang-switch button {
    font: inherit; font-size: 0.74rem; font-weight: 600; letter-spacing: 0.06em;
    padding: 0.32rem 0.75rem; border: none; background: transparent;
    color: var(--ink-3); cursor: pointer;
  }
  .lang-switch button.active { background: var(--ink); color: var(--bg); cursor: default; }
  .lang-switch button:not(.active):hover { color: var(--ink); }
  .lang-switch button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  .eyebrow {
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 600;
    margin: 0 0 0.75rem;
    padding-right: 7rem;
  }
  .eyebrow .mark { color: var(--accent); }

  h1, h2, h3 { font-family: "Fraunces", Georgia, serif; text-wrap: balance; margin: 0; }
  h1 { font-size: clamp(2rem, 5vw, 2.9rem); font-weight: 600; line-height: 1.12; letter-spacing: -0.01em; }
  h2 { font-size: 1.45rem; font-weight: 600; }
  h3 { font-size: 1.05rem; font-weight: 600; }
  p  { margin: 0; }
  .lede { color: var(--ink-2); font-size: 1.05rem; max-width: 58ch; }

  .formula {
    font-family: "Fraunces", Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: clamp(1.5rem, 4.6vw, 2.3rem);
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: center;
    gap: 0.3em;
    margin: 2.2rem 0 0.4rem;
  }
  .formula .op { color: var(--ink-3); font-weight: 400; }
  .formula .t-iq   { color: var(--q-iq); }
  .formula .t-eq   { color: var(--q-eq); }
  .formula .t-pasq { color: var(--q-pasq); }
  .formula .t-cuq  { color: var(--q-cuq); }
  .formula .t-p    { color: var(--accent); }
  .formula-legend {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 0.6rem 1.2rem;
    margin: 1.6rem 0 0;
    padding: 0;
    list-style: none;
  }
  .formula-legend li { font-size: 0.86rem; color: var(--ink-2); }
  .formula-legend .chip {
    display: inline-block; width: 0.62em; height: 0.62em; border-radius: 2px;
    margin-right: 0.45em;
  }
  .formula-legend strong { color: var(--ink); font-weight: 600; }

  .btn {
    display: inline-flex; align-items: center; gap: 0.5em;
    font: inherit; font-weight: 600; font-size: 0.95rem;
    padding: 0.7rem 1.5rem;
    border-radius: 6px;
    border: 1px solid transparent;
    cursor: pointer;
    background: var(--accent); color: var(--accent-ink);
    transition: filter 120ms ease;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:focus-visible, .likert input:focus-visible + label, a:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .btn[disabled] { opacity: 0.45; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--ink-2); border-color: var(--line-strong); }
  .btn.ghost:hover { color: var(--ink); filter: none; border-color: var(--ink-3); }
  .btn.small { font-size: 0.84rem; padding: 0.5rem 1rem; }
  .linklike {
    background: none; border: none; font: inherit; font-size: 0.86rem;
    color: var(--ink-3); text-decoration: underline; cursor: pointer; padding: 0;
  }
  .linklike:hover { color: var(--ink); }

  .progress { margin: 0 0 2rem; }
  .progress-steps { display: flex; gap: 0.4rem; margin-bottom: 0.5rem; }
  .progress-steps .seg {
    flex: 1; height: 4px; border-radius: 2px; background: var(--track);
    position: relative; overflow: hidden;
  }
  .progress-steps .seg .fill {
    position: absolute; inset: 0; width: 0%; background: var(--accent);
    transition: width 200ms ease;
  }
  .progress-note {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.72rem; color: var(--ink-3);
    display: flex; justify-content: space-between;
  }

  .q-head { border-left: 3px solid var(--qc, var(--accent)); padding-left: 1rem; margin-bottom: 1.8rem; }
  .q-head .q-tag {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--qc, var(--accent)); font-weight: 600; display: block; margin-bottom: 0.35rem;
  }
  .q-head p { color: var(--ink-2); font-size: 0.95rem; margin-top: 0.4rem; max-width: 58ch; }

  .item { padding: 1.35rem 0; border-bottom: 1px solid var(--line); }
  .item:last-of-type { border-bottom: none; }
  .item .stmt { font-weight: 500; margin-bottom: 0.9rem; max-width: 60ch; }
  .item .stmt .n {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.78rem; color: var(--ink-3); margin-right: 0.6em;
  }

  .likert { display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; }
  .likert .cap { font-size: 0.74rem; color: var(--ink-3); min-width: 5.2em; }
  .likert .cap.hi { text-align: left; }
  .likert .opts { display: flex; gap: 0.45rem; }
  .likert input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .likert label {
    display: flex; align-items: center; justify-content: center;
    width: 2.6rem; height: 2.6rem;
    border: 1px solid var(--line-strong); border-radius: 6px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.9rem; color: var(--ink-2);
    cursor: pointer; user-select: none;
    background: var(--surface);
    transition: border-color 100ms, background 100ms, color 100ms;
  }
  .likert label:hover { border-color: var(--ink-3); color: var(--ink); }
  .likert input:checked + label {
    background: var(--qc, var(--accent));
    border-color: var(--qc, var(--accent));
    color: var(--bg);
    font-weight: 600;
  }

  .nav-row { display: flex; justify-content: space-between; align-items: center; margin-top: 2.2rem; gap: 1rem; }
  .nav-row .hint { font-size: 0.82rem; color: var(--ink-3); }

  .score-hero {
    display: flex; flex-wrap: wrap; align-items: center; gap: 1.5rem 2.5rem;
    padding: 1.8rem 0 1.6rem;
  }
  .score-hero .num {
    font-family: "Fraunces", Georgia, serif;
    font-size: clamp(4rem, 12vw, 6.2rem); font-weight: 700; line-height: 0.95;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .score-hero .of { font-size: 1rem; color: var(--ink-3); font-family: "IBM Plex Mono", ui-monospace, monospace; }
  .level-pill {
    display: inline-block; padding: 0.32em 0.9em; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent);
    font-weight: 600; font-size: 0.95rem; letter-spacing: 0.02em;
    margin-bottom: 0.5rem;
  }
  .score-hero .read { max-width: 46ch; color: var(--ink-2); font-size: 0.98rem; }

  .filled-formula {
    font-family: "Fraunces", Georgia, serif; font-style: italic; font-weight: 600;
    font-size: clamp(1.1rem, 3.4vw, 1.5rem);
    padding: 1.1rem 1.3rem;
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    display: flex; flex-wrap: wrap; gap: 0.3em; align-items: baseline;
    justify-content: center;
    overflow-x: auto;
  }
  .filled-formula .val { font-variant-numeric: tabular-nums; }

  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 1.6rem; margin-top: 1.6rem; box-shadow: var(--shadow);
  }
  .card > h3 { margin-bottom: 0.35rem; }
  .card .sub { font-size: 0.86rem; color: var(--ink-3); margin-bottom: 1.2rem; }

  .chart-scroll { overflow-x: auto; }
  svg text { font-family: "Instrument Sans", Arial, sans-serif; }
  svg .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }

  .quad-note { font-size: 0.9rem; color: var(--ink-2); margin-top: 1rem; max-width: 60ch; }
  .quad-note strong { color: var(--ink); }

  .recs { display: grid; gap: 1rem; margin-top: 0.4rem; }
  .rec { border-left: 3px solid var(--qc, var(--accent)); padding: 0.15rem 0 0.15rem 1rem; }
  .rec h4 {
    font-family: "Fraunces", Georgia, serif; font-size: 1rem; font-weight: 600; margin: 0 0 0.3rem;
  }
  .rec ul { margin: 0.3rem 0 0; padding-left: 1.1rem; color: var(--ink-2); font-size: 0.92rem; }
  .rec li { margin-bottom: 0.25rem; }
  .rec .ex { font-size: 0.82rem; color: var(--ink-3); font-style: italic; margin-top: 0.35rem; }

  .org-form {
    margin-top: 2rem; padding: 1.3rem 1.4rem;
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    max-width: 34rem;
  }
  .org-form .o-title, .team-card .o-title, .session-card .o-title, .admin-box .o-title {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--accent); font-weight: 600; display: block; margin-bottom: 0.9rem;
  }
  .org-form .field { margin-bottom: 0.9rem; }
  .org-form .field:last-child { margin-bottom: 0; }
  .org-form label, .admin-box label {
    display: block; font-size: 0.82rem; font-weight: 600; color: var(--ink-2);
    margin-bottom: 0.3rem;
  }
  .org-form label .opt { font-weight: 400; color: var(--ink-3); }
  .org-form input[type="text"], .org-form select, .admin-box input[type="text"] {
    width: 100%; font: inherit; font-size: 0.95rem;
    padding: 0.55rem 0.75rem;
    border: 1px solid var(--line-strong); border-radius: 6px;
    background: var(--bg); color: var(--ink);
  }
  .org-form input:focus-visible, .org-form select:focus-visible, .admin-box input:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent);
  }
  .org-form input::placeholder, .admin-box input::placeholder { color: var(--ink-3); opacity: 1; }
  .start-hint { display: block; margin-top: 0.6rem; font-size: 0.82rem; color: var(--ink-3); }

  .team-card, .session-card {
    margin-top: 1.4rem; padding: 1.3rem 1.4rem;
    background: var(--surface); border: 1px dashed var(--line-strong); border-radius: 8px;
    max-width: 34rem;
  }
  .session-card { border-style: solid; border-color: var(--accent); }
  .team-card p, .session-card p { font-size: 0.9rem; color: var(--ink-2); }
  .session-card .s-org { font-family: "Fraunces", Georgia, serif; font-size: 1.2rem; font-weight: 600; color: var(--ink); margin: 0.1rem 0 0.2rem; }
  .session-card .s-count {
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.8rem; color: var(--accent);
    font-weight: 600;
  }
  .share-panel { display: flex; gap: 1.2rem; align-items: flex-start; flex-wrap: wrap; margin-top: 1rem; }
  .share-panel .qr { width: 148px; flex: none; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
  .share-panel .qr svg { display: block; width: 100%; height: auto; }
  .share-panel .share-right { flex: 1; min-width: 220px; }
  .share-panel .link-box {
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.74rem;
    padding: 0.5rem 0.6rem; border: 1px solid var(--line-strong); border-radius: 6px;
    background: var(--bg); color: var(--ink-2); word-break: break-all;
    margin: 0.5rem 0 0.6rem; cursor: text; user-select: all;
  }
  .btn-row { display: flex; gap: 0.7rem; flex-wrap: wrap; margin-top: 1.1rem; }

  .archive-card {
    margin-top: 1.4rem; padding: 1.3rem 1.4rem;
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    max-width: 34rem;
  }
  .archive-card .o-title {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-3); font-weight: 600; display: block; margin-bottom: 0.6rem;
  }
  .archive-row {
    display: flex; align-items: center; justify-content: space-between; gap: 0.8rem;
    padding: 0.6rem 0; border-top: 1px solid var(--line); flex-wrap: wrap;
  }
  .archive-row:first-of-type { border-top: none; }
  .archive-row .a-org { font-weight: 600; color: var(--ink); font-size: 0.92rem; }
  .archive-row .a-meta { font-size: 0.78rem; color: var(--ink-3); font-family: "IBM Plex Mono", ui-monospace, monospace; }

  .present-overlay {
    position: fixed; inset: 0; z-index: 60;
    background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.1rem; padding: 2rem; text-align: center; cursor: pointer;
  }
  .present-overlay .p-org {
    font-family: "Fraunces", Georgia, serif; font-weight: 600;
    font-size: clamp(1.8rem, 4.5vw, 3.2rem); line-height: 1.1;
  }
  .present-overlay .p-qr {
    width: min(56vh, 82vw); background: #fff; border-radius: 12px; overflow: hidden;
    box-shadow: var(--shadow);
  }
  .present-overlay .p-qr svg { display: block; width: 100%; height: auto; }
  .present-overlay .p-scan { font-size: clamp(1.1rem, 2.6vw, 1.7rem); font-weight: 600; color: var(--ink-2); }
  .present-overlay .p-url {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: clamp(0.75rem, 1.6vw, 1rem); color: var(--ink-3); word-break: break-all; max-width: 90vw;
  }
  .present-overlay .p-exit { position: fixed; top: 1rem; right: 1.4rem; font-size: 0.8rem; color: var(--ink-3); }

  .status-banner {
    margin: 0 0 1.4rem; padding: 0.9rem 1.2rem; border-radius: 8px;
    background: var(--accent-soft); color: var(--ink-2); font-size: 0.92rem;
  }
  .status-banner strong { color: var(--ink); }
  .status-banner.err { outline: 1px solid var(--accent); }
  .code-box {
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.72rem;
    padding: 0.6rem; border: 1px solid var(--line-strong); border-radius: 6px;
    background: var(--bg); color: var(--ink-2); word-break: break-all;
    margin-top: 0.6rem; user-select: all; max-height: 7em; overflow-y: auto;
  }
  .admin-box {
    margin-top: 1.4rem; padding: 1.2rem 1.4rem;
    background: var(--surface-2); border-radius: 8px;
  }
  .admin-box .a-msg { font-size: 0.82rem; margin-top: 0.5rem; color: var(--ink-3); }

  .purpose-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1rem; margin-top: 2rem;
  }
  .purpose-item {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 1rem 1.1rem;
  }
  .purpose-item .p-tag {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--accent); font-weight: 600; display: block; margin-bottom: 0.4rem;
  }
  .purpose-item p { font-size: 0.87rem; color: var(--ink-2); }

  .posture {
    padding: 1.2rem 1.4rem; margin-bottom: 1.4rem;
    background: var(--accent-soft); border-radius: 8px;
    font-size: 0.94rem; color: var(--ink-2);
  }
  .posture strong { color: var(--ink); }

  .levers { display: grid; gap: 1.1rem; }
  .lever { border-top: 1px solid var(--line); padding-top: 1rem; }
  .lever .l-tag {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-3); font-weight: 600; display: block; margin-bottom: 0.3rem;
  }
  .lever h4 {
    font-family: "Fraunces", Georgia, serif; font-size: 0.98rem; font-weight: 600; margin: 0 0 0.3rem;
  }
  .lever p { font-size: 0.9rem; color: var(--ink-2); }
  .lever .decide {
    margin-top: 0.5rem; font-size: 0.88rem; color: var(--ink);
    padding-left: 0.9rem; border-left: 2px solid var(--accent);
  }
  .lever .decide .d-label { font-weight: 600; color: var(--accent); }

  .org-line { margin-top: 0.6rem; font-size: 0.98rem; color: var(--ink-2); }
  .org-line strong { color: var(--ink); font-weight: 600; }
  .org-line .sep { color: var(--ink-3); margin: 0 0.4em; }

  .foot {
    margin-top: 3rem; padding-top: 1.2rem; border-top: 1px solid var(--line);
    font-size: 0.8rem; color: var(--ink-3); max-width: 62ch;
  }

  .tooltip {
    position: fixed; pointer-events: none; z-index: 10;
    background: var(--ink); color: var(--bg);
    font-size: 0.78rem; font-weight: 500;
    padding: 0.35rem 0.6rem; border-radius: 5px;
    opacity: 0; transition: opacity 100ms;
    white-space: nowrap;
  }
  .tooltip.show { opacity: 1; }

  .screen { display: none; }
  .screen.active { display: block; animation: fade 240ms ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .screen.active { animation: none; }
    .progress-steps .seg .fill { transition: none; }
  }
  @media print {
    .btn, .nav-row, .lang-switch, .admin-box, .linklike { display: none !important; }
    body { background: #fff; color: #111; }
  }
</style>

<div class="wrap">
  <div class="lang-switch" role="group" aria-label="Language / Langue">
    <button id="lang-en" class="active" aria-pressed="true">EN</button>
    <button id="lang-fr" aria-pressed="false">FR</button>
  </div>

  <!-- ============ INTRO ============ -->
  <section class="screen active" id="s-intro">
    <p class="eyebrow" id="i-eyebrow"></p>
    <h1 id="i-title"></h1>

  var QMETA = [
    { key: "iq",   name: "IQ",   cssVar: "--q-iq" },
    { key: "eq",   name: "EQ",   cssVar: "--q-eq" },
    { key: "pasq", name: "PasQ", cssVar: "--q-pasq" },
    { key: "cuq",  name: "CuQ",  cssVar: "--q-cuq" }
  ];

  // ---------- state ----------
  var lang = (STANDALONE && STANDALONE.lang === "fr") ? "fr" : "en";
  var answers = {};
  QMETA.forEach(function (q) { answers[q.key] = [null, null, null, null, null, null]; });
  var step = 0;
  var MODE = "solo";           // 'solo' | 'respond' (session respondent)
  var RESULTS_MODE = "solo";   // 'solo' | 'personal' | 'live'
  var forceSolo = false;
  var ART = undefined;         // artifact namespace: undefined = resolving, null = unavailable
  var DL = undefined;          // downloads namespace
  var closeArmed = false;
  var LIVE_SRC = null;         // null = current session; otherwise an archived session being viewed
  function liveSession() { return LIVE_SRC || SESSION; }

  var $ = function (id) { return document.getElementById(id); };
  var T = function () { return I18N[lang]; };
  var screens = { intro: $("s-intro"), survey: $("s-survey"), results: $("s-results") };

  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function fmt(n) { return (Math.round(n * 10) / 10).toFixed(1); }
  function css(varName) { return getComputedStyle(document.documentElement).getPropertyValue(varName).trim(); }
  function mean(arr) { return arr.reduce(function (a, b) { return a + b; }, 0) / arr.length; }
  function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

  function sessionActive() { return SESSION && SESSION.active && !SESSION.closed; }
  function deptLabel(key, other) {
    if (!key) return "";
    if (key === "other") return other || "";
    return DEPTS[key] ? DEPTS[key][lang] : "";
  }
  function currentOrg() {
    if (STANDALONE) {
      return { name: STANDALONE.org || T().genericOrg, dept: deptLabel(STANDALONE.deptKey, STANDALONE.deptOther) };
    }
    var ls = (RESULTS_MODE === "live") ? liveSession() : SESSION;
    if ((MODE === "respond" || RESULTS_MODE === "live" || RESULTS_MODE === "personal") && ls) {
      return { name: ls.org, dept: deptLabel(ls.deptKey, ls.deptOther) };
    }
    return { name: $("org-name").value.trim(), dept: deptLabel($("org-dept").value, $("org-dept-other").value.trim()) };
  }

  function show(name) {
    Object.keys(screens).forEach(function (k) { screens[k].classList.toggle("active", k === name); });
    window.scrollTo({ top: 0 });
  }
  function activeScreen() {
    var keys = Object.keys(screens);
    for (var i = 0; i < keys.length; i++) if (screens[keys[i]].classList.contains("active")) return keys[i];
    return "intro";
  }

  // ---------- static text ----------
  function fillDeptSelect() {
    var t = T();
    var cur = $("org-dept").value;
    var html = '<option value="">' + esc(t.deptPlaceholder) + "</option>";
    DEPT_ORDER.forEach(function (k) {
      html += '<option value="' + k + '"' + (cur === k ? " selected" : "") + ">" + esc(DEPTS[k][lang]) + "</option>";
    });

  function setLang(l) {
    if (lang === l) return;
    lang = l;
    $("lang-en").classList.toggle("active", l === "en");
    $("lang-fr").classList.toggle("active", l === "fr");
    $("lang-en").setAttribute("aria-pressed", l === "en");
    $("lang-fr").setAttribute("aria-pressed", l === "fr");
    applyStatic();
    var sc = activeScreen();
    if (sc === "survey") renderSection();
    else if (sc === "results") renderResults(RESULTS_MODE);
  }

  // ---------- intro modes / session UI ----------
  function shareUrl() {
    if (SESSION && SESSION.shareUrl) return SESSION.shareUrl;
    if (HOSTED_URL && SESSION) {
      var p = "?org=" + encodeURIComponent(SESSION.org);
      var d = deptLabel(SESSION.deptKey, SESSION.deptOther);
      if (d) p += "&dept=" + encodeURIComponent(d);
      if (lang === "fr") p += "&lang=fr";
      return HOSTED_URL + p;
    }
    return ARTIFACT_URL;
  }
  function shareHTML() {

      (ART ? '<div style="margin-top:0.8rem">' +

  function downloadHTML() {
    var t = T();

    return '<div style="margin-top:1.2rem;border-top:1px solid var(--line);padding-top:1rem">' +
      '<strong style="font-size:0.86rem">' + esc(t.dlTitle) + '</strong>' +

      '<label style="display:block;font-size:0.8rem;font-weight:600;color:var(--ink-2);margin:0.7rem 0 0.3rem" for="dl-email">' + t.dlEmailLabel + '</label>' +
      '<div style="display:flex;gap:0.6rem;flex-wrap:wrap">' +

      '<button class="btn ghost small" id="btn-download">' + esc(t.btnDownload) + '</button></div>' +
      '<p class="a-msg" id="dl-msg" style="font-size:0.78rem;color:var(--ink-3);margin-top:0.3rem"></p>' +
      '</div>';
  }

  function renderIntroMode() {
    var t = T();
    var sess = $("i-session");
    var team = $("i-team");

    if (STANDALONE) {
      var dept = deptLabel(STANDALONE.deptKey, STANDALONE.deptOther);
      sess.innerHTML = '<div class="session-card">' +
        '<span class="o-title">' + esc(t.standaloneTag) + '</span>' +
        '<p class="s-org">' + esc(STANDALONE.org || t.genericOrg) + (dept ? ' <span style="font-weight:400;color:var(--ink-3)">· ' + esc(dept) + "</span>" : "") + '</p>' +
        '<p style="margin-top:0.5rem">' + (STANDALONE.org ? t.standaloneIntro.replace("{org}", esc(STANDALONE.org)) : t.standaloneIntroGeneric) + '</p>' +
        '</div>';
      $("org-form").hidden = true;
      $("start-row").hidden = false;
      $("btn-start").disabled = false;
      $("start-hint").textContent = "";
      team.innerHTML = "";
      $("i-archive").innerHTML = "";
      return;
    }

    var showForm = !sessionActive() || forceSolo;
    $("org-form").hidden = !showForm;
    $("start-row").hidden = false;

    if (SESSION && SESSION.closed && !forceSolo) {
      sess.innerHTML = '<div class="session-card">' +
        '<span class="o-title">' + esc(t.sessionLive) + '</span>' +
        '<p>' + t.sessionClosedIntro.replace("{org}", esc(SESSION.org)) + '</p>' +
        '<div class="btn-row"><button class="btn" id="btn-view-live">' + esc(t.btnReport) + '</button>' +
        (ART ? '<button class="btn ghost" id="btn-new-sess">' + esc(t.btnNewSession) + '</button>' : '') + '</div>' +
        '<p style="margin-top:0.9rem"><button class="linklike" id="btn-solo">' + esc(t.soloInstead) + '</button></p>' +
        '</div>';
      $("org-form").hidden = true;
      $("start-row").hidden = true;
      wireSessionCard();
      return;
    }

    if (sessionActive() && !forceSolo) {
      var n = SESSION.responses.length;
      sess.innerHTML = '<div class="session-card">' +
        '<span class="o-title">' + esc(t.sessionLive) + '</span>' +
        '<p class="s-org">' + esc(SESSION.org) + (deptLabel(SESSION.deptKey, SESSION.deptOther) ? ' <span style="font-weight:400;color:var(--ink-3)">· ' + esc(deptLabel(SESSION.deptKey, SESSION.deptOther)) + "</span>" : "") + '</p>' +
        '<p class="s-count">' + esc(t.respN(n)) + '</p>' +

        downloadHTML() +
        '<div class="btn-row">' +
        '<button class="btn" id="btn-join">' + esc(t.btnStart) + '</button>' +
        '<button class="btn ghost" id="btn-view-live">' + esc(t.btnLive) + '</button>' +
        '<button class="btn ghost" id="btn-present">' + esc(t.btnPresent) + '</button>' +
        '</div>' +
        '<p style="margin-top:0.9rem"><button class="linklike" id="btn-solo">' + esc(t.soloInstead) + '</button></p>' +
        '</div>';

      wireSessionCard();
    } else {
      sess.innerHTML = "";

        '</div>';
      var bc = $("btn-create");
      if (bc) bc.addEventListener("click", createSession);

      team.innerHTML = "";

    renderArchive();

  function renderArchive() {
    var t = T();
    var box = $("i-archive");
    if (!ARCHIVE.length) { box.innerHTML = ""; return; }
    var html = '<div class="archive-card"><span class="o-title">' + esc(t.pastTitle) + '</span>';
    ARCHIVE.forEach(function (a, i) {
      var d = new Date(a.createdAt).toLocaleDateString(lang === "fr" ? "fr-CA" : "en-CA", { year: "numeric", month: "short", day: "numeric" });
      html += '<div class="archive-row"><div><div class="a-org">' + esc(a.org) +
        (deptLabel(a.deptKey, a.deptOther) ? ' <span style="font-weight:400;color:var(--ink-3)">· ' + esc(deptLabel(a.deptKey, a.deptOther)) + '</span>' : '') +
        '</div><div class="a-meta">' + d + ' · ' + esc(t.respN(a.responses.length)) + '</div></div>' +
        '<button class="btn ghost small arch-view" data-i="' + i + '">' + esc(t.btnReport) + '</button></div>';
    });
    html += "</div>";
    box.innerHTML = html;
    Array.prototype.slice.call(box.querySelectorAll(".arch-view")).forEach(function (b) {
      b.addEventListener("click", function () {
        LIVE_SRC = ARCHIVE[+b.getAttribute("data-i")];
        renderResults("live"); show("results");
      });
    });
  }

  function openPresent() {
    var old = $("present-overlay");
    if (old) old.parentNode.removeChild(old);
    var url = shareUrl();
    var qrSvg = "";
    try { qrSvg = QR.toSVG(QR.encode(url), 4, 4); } catch (e) {}
    var ov = document.createElement("div");
    ov.className = "present-overlay"; ov.id = "present-overlay";
    ov.innerHTML = '<div class="p-exit">Esc ✕</div>' +
      '<div class="p-org">' + esc(SESSION ? SESSION.org : "") + '</div>' +
      '<div class="p-qr">' + qrSvg + '</div>' +
      '<div class="p-scan">Scan to begin · Balayez pour commencer</div>' +
      '<div class="p-url">' + esc(url) + '</div>';
    document.body.appendChild(ov);
    try { sessionStorage.setItem("fq-present", "1"); } catch (e) {}
    function close() {
      if (ov.parentNode) ov.parentNode.removeChild(ov);
      try { sessionStorage.removeItem("fq-present"); } catch (e) {}
      document.removeEventListener("keydown", onKey);
    }
    function onKey(e) { if (e.key === "Escape") close(); }
    ov.addEventListener("click", close);
    document.addEventListener("keydown", onKey);
  }

  function wireSessionCard() {
    var j = $("btn-join"), v = $("btn-view-live"), s = $("btn-solo"), c = $("btn-copy");
    var pr = $("btn-present");
    if (pr) pr.addEventListener("click", openPresent);
    var nsb = $("btn-new-sess");
    if (nsb) nsb.addEventListener("click", function () {

  function buildPdf() {

          Array.prototype.slice.call(r.querySelectorAll("svg")).forEach(function (svg) {
            var bb = svg.getBoundingClientRect();

            });
          });
          var top = r.getBoundingClientRect().top;
          var list = [];
          Array.prototype.slice.call(r.children).forEach(function (el) {

            else list.push(el);
          });
          list.forEach(function (el) {

      });
    });

    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="max-width:600px;display:block;margin:0 auto" role="img" aria-label="' + t.barsAria + '">';
    for (var g = 1; g <= 5; g++) {
      svg += '<line x1="' + x(g) + '" y1="' + m.t + '" x2="' + x(g) + '" y2="' + (H - m.b) + '" stroke="' + grid + '" stroke-width="1"/>';
      svg += '<text x="' + x(g) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11" class="mono" fill="' + ink3 + '">' + g + '</text>';
    }
    QMETA.forEach(function (meta, i) {
      var v = s[meta.key];
      var cy = m.t + i * rowH + rowH / 2;
      var col = css(meta.cssVar);
      var barH = 16;
      svg += '<text x="' + (m.l - 14) + '" y="' + (cy - 2) + '" text-anchor="end" font-size="13" font-weight="600" fill="' + ink + '">' + meta.name + '</text>';
      svg += '<text x="' + (m.l - 14) + '" y="' + (cy + 12) + '" text-anchor="end" font-size="10.5" fill="' + ink3 + '">' + t.quotients[i].short + '</text>';
      svg += '<rect x="' + x(1) + '" y="' + (cy - barH / 2) + '" width="' + pw + '" height="' + barH + '" rx="4" fill="' + track + '"/>';
      var w = Math.max(x(v) - x(1), 2);
      svg += '<rect class="qbar" data-label="' + meta.name + ': ' + fmt(v) + ' / 5" x="' + x(1) + '" y="' + (cy - barH / 2) + '" width="' + w + '" height="' + barH + '" rx="4" fill="' + col + '" stroke="' + bg + '" stroke-width="1"/>';
      if (range && range.min && range.n > 1) {
        var xmin = x(range.min[meta.key]), xmax = x(range.max[meta.key]);
        svg += '<line x1="' + xmin + '" y1="' + cy + '" x2="' + xmax + '" y2="' + cy + '" stroke="' + ink + '" stroke-width="1.5" opacity="0.55"/>';
        svg += '<line x1="' + xmin + '" y1="' + (cy - 5) + '" x2="' + xmin + '" y2="' + (cy + 5) + '" stroke="' + ink + '" stroke-width="1.5" opacity="0.55"/>';
        svg += '<line x1="' + xmax + '" y1="' + (cy - 5) + '" x2="' + xmax + '" y2="' + (cy + 5) + '" stroke="' + ink + '" stroke-width="1.5" opacity="0.55"/>';
      }
      svg += '<text x="' + (x(v) + 8) + '" y="' + (cy + 4.5) + '" font-size="12.5" font-weight="600" class="mono" fill="' + ink2 + '">' + fmt(v) + '</text>';
    });
    svg += "</svg>";
    $("bar-chart").innerHTML = svg;

    var tip = $("tooltip");
    document.querySelectorAll(".qbar").forEach(function (bar) {
      bar.addEventListener("mousemove", function (e) {
        tip.textContent = bar.getAttribute("data-label");
        tip.style.left = (e.clientX + 12) + "px";
        tip.style.top = (e.clientY - 30) + "px";
        tip.classList.add("show");
      });
      bar.addEventListener("mouseleave", function () { tip.classList.remove("show"); });
    });
  }

  function renderRecs(s) {
    var t = T();
    var order = ["iq", "eq", "pasq", "cuq"].sort(function (a, b) { return s[a] - s[b]; });
    var lowest = order.slice(0, 2);
    var html = "";
    lowest.forEach(function (key) {
      var rec = t.recs[key];
      var meta = QMETA.filter(function (x) { return x.key === key; })[0];
      html += '<div class="rec" style="--qc:var(' + meta.cssVar + ')"><h4>' + rec.title +
        ' <span class="mono" style="font-size:0.8rem;color:var(--ink-3)">(' + fmt(s[key]) + ' / 5)</span></h4><ul>';
      rec.moves.forEach(function (mv) { html += "<li>" + mv + "</li>"; });
      html += '</ul><p class="ex">' + rec.ex + "</p></div>";
    });
    $("r-recs").innerHTML = html;
  }

  function renderTransform(arch) {
    var t = T();
    $("t-posture").innerHTML = arch.posture;
    $("t-levers").innerHTML = t.trLevers.map(function (lv) {
      return '<div class="lever"><span class="l-tag">' + lv.tag + '</span><h4>' + lv.title + '</h4>' +
        '<p>' + lv.text + '</p>' +
        '<p class="decide"><span class="d-label">' + t.decideLabel + '</span> ' + lv.q + '</p></div>';
    }).join("");
  }

  // ---------- session admin (live view) ----------
  function renderAdmin() {
    var t = T();
    var box = $("live-admin");
    if (RESULTS_MODE !== "live" || !SESSION || LIVE_SRC || !ART) { box.innerHTML = ""; closeArmed = false; return; }
    var html = '<div class="admin-box">';
    if (!SESSION.closed) {
      html += '<span class="o-title">' + esc(t.addCodeTitle) + '</span>' +
        '<p style="font-size:0.86rem;color:var(--ink-2)">' + esc(t.addCodeDesc) + '</p>' +
        '<div style="display:flex;gap:0.6rem;margin-top:0.6rem;flex-wrap:wrap;align-items:flex-start">' +
        '<textarea id="code-input" rows="3" placeholder="' + esc(t.addCodePh) + '" style="flex:1;min-width:200px;font-family:\'IBM Plex Mono\',ui-monospace,monospace;font-size:0.78rem;padding:0.5rem 0.6rem;border:1px solid var(--line-strong);border-radius:6px;background:var(--bg);color:var(--ink);resize:vertical"></textarea>' +
        '<button class="btn ghost small" id="btn-add-code">' + esc(t.btnAddCode) + '</button></div>' +
        '<p class="a-msg" id="code-msg"></p>' +
        '<div class="btn-row"><button class="btn ghost small" id="btn-close-sess">' + esc(t.btnCloseSess) + '</button></div>';
    } else {
      html += '<div class="btn-row"><button class="btn ghost small" id="btn-reopen">' + esc(t.btnReopen) + '</button></div>';
    }
    html += '<p class="a-msg" id="admin-msg"></p></div>';
    box.innerHTML = html;

    var add = $("btn-add-code");
    if (add) add.addEventListener("click", function () {
      var raw = $("code-input").value.trim();
      var msg = $("code-msg");
      var codes = raw.split(/\s+/).filter(Boolean);
      if (!codes.length) return;
      var valid = [], invalid = 0, dup = 0;
      var seen = {};
      SESSION.responses.forEach(function (r) { seen[r.id] = true; });
      codes.forEach(function (c) {
        var r = decodeResponse(c);
        if (!r) { invalid++; return; }
        if (seen[r.id]) { dup++; return; }
        seen[r.id] = true;
        valid.push(r);
      });
      if (!valid.length) { msg.textContent = invalid ? t.addCodeErr : t.addCodeDup; return; }
      var ns = JSON.parse(JSON.stringify(SESSION));
      valid.forEach(function (r) { ns.responses.push(r); });
      msg.textContent = "…";
      publishSession(ns).then(function () {
        msg.textContent = valid.length + " ✓" + (invalid ? " · " + invalid + " ✗" : "");
      }, function () { msg.textContent = t.saveErr; });
    });
    var cl = $("btn-close-sess");
    if (cl) cl.addEventListener("click", function () {
      if (!closeArmed) { closeArmed = true; cl.textContent = t.btnCloseConfirm; return; }
      var ns = JSON.parse(JSON.stringify(SESSION)); ns.closed = true;
      publishSession(ns).catch(function () { $("admin-msg").textContent = t.saveErr; });
    });
    var ro = $("btn-reopen");
    if (ro) ro.addEventListener("click", function () {
      var ns = JSON.parse(JSON.stringify(SESSION)); ns.closed = false;
      publishSession(ns).catch(function () { $("admin-msg").textContent = t.saveErr; });
    });
  }

  // ---------- session persistence ----------
  function buildDocument(store) {
    var json = JSON.stringify(store).replace(/</g, "\\u003c");
    return INITIAL_HTML.replace(/<html[^>]*>/, "<html>").replace(
      /(<script type="application\/json" id="fq-data">)[\s\S]*?(<\/script>)/,
      function (mm, p1, p2) { return p1 + json + p2; }
    );
  }
  function storeWith(sess) { return { v: 1, session: sess, archive: ARCHIVE }; }
  function publishStore(store) {
    if (!ART) return Promise.reject({ code: "unavailable" });
    return ART.publish(buildDocument(store));
  }
  function publishSession(newSession) { return publishStore(storeWith(newSession)); }
  function withResponse(sess, resp) {
    var ns = JSON.parse(JSON.stringify(sess));
    ns.responses.push(resp);
    return ns;
  }
  function decodeResponse(code) {
    try {
      var obj = JSON.parse(decodeURIComponent(escape(atob(code))));
      if (!obj || !obj.id || !obj.answers) return null;
      var ok = QMETA.every(function (q) {
        var a = obj.answers[q.key];
        return Array.isArray(a) && a.length === 6 && a.every(function (v) { return v >= 1 && v <= 5; });
      });
      return ok ? obj : null;
    } catch (e) { return null; }
  }
  function encodeResponse(resp) {
    return btoa(unescape(encodeURIComponent(JSON.stringify(resp))));
  }
  function makeResponse() {
    var id = "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    return { id: id, ts: Date.now(), lang: lang,
      org: STANDALONE ? (STANDALONE.org || "") : (SESSION ? SESSION.org : ""),
      answers: JSON.parse(JSON.stringify(answers)) };
  }

  function createSession() {
    var t = T();
    var name = $("org-name").value.trim();
    if (!name || !ART) return;
    var msg = $("create-msg");
    if (msg) msg.textContent = t.creating;
    var sess = {
      active: true, closed: false,
      org: name,
      deptKey: $("org-dept").value || "",
      deptOther: $("org-dept-other").value.trim(),
      createdAt: Date.now(),
      responses: []
    };
    publishSession(sess).then(function () {
      // all views (this one included) reload into session mode
    }, function (e) {
      if (msg) msg.textContent = t.saveErr;
    });
  }

  function submitResponse() {
    var t = T();
    var status = $("submit-status");
    var resp = makeResponse();
    status.innerHTML = '<div class="status-banner">' + esc(t.submitPending) + "</div>";
    lsSet("fq-pending-" + ARTIFACT_URL, resp);
    if (!ART) { showFallback(resp); return; }
    publishSession(withResponse(SESSION, resp)).then(function () {
      lsDel("fq-pending-" + ARTIFACT_URL);
      status.innerHTML = '<div class="status-banner">' + t.submitOk + "</div>";
    }, function (e) {
      var code = e && e.code;
      if (code === "not_granted" || code === "not_writer") { showFallback(resp); }
      else if (code === "conflict") {
        // the view reloads to the winning version; the pending response is retried on load
        status.innerHTML = '<div class="status-banner">' + esc(t.submitPending) + "</div>";
      } else {
        status.innerHTML = '<div class="status-banner err">' + esc(t.submitErr) +
          '<div class="code-box">' + esc(encodeResponse(resp)) + "</div></div>";
      }
    });
    function showFallback(r) {
      lsDel("fq-pending-" + ARTIFACT_URL);
      var code = encodeResponse(r);
      var mailBtn = "";
      if (SESSION && SESSION.email) {
        var href = "mailto:" + SESSION.email +
          "?subject=" + encodeURIComponent(t.emailSubject.replace("{org}", SESSION.org)) +
          "&body=" + encodeURIComponent(t.emailBody.replace(/\{org\}/g, SESSION.org).replace("{code}", code));
        mailBtn = '<div class="btn-row"><a class="btn small" style="text-decoration:none" href="' + esc(href) + '">' + esc(t.sendEmail) + "</a></div>";
      }
      status.innerHTML = '<div class="status-banner err">' + t.submitFallback +
        '<div style="margin-top:0.6rem;font-size:0.82rem;font-weight:600">' + esc(t.codeLabel) + "</div>" +
        '<div class="code-box">' + esc(code) + "</div>" + mailBtn + "</div>";
    }
  }

  function renderStandaloneDone() {
    var t = T();
    var resp = makeResponse();
    var code = encodeResponse(resp);
    var email = STANDALONE.email || "";
    var orgName = STANDALONE.org || t.genericOrg;
    var mailtoHref = "";
    if (email) {
      mailtoHref = "mailto:" + email +
        "?subject=" + encodeURIComponent(t.emailSubject.replace("{org}", orgName)) +
        "&body=" + encodeURIComponent(t.emailBody.replace(/\{org\}/g, orgName).replace("{code}", code));
    }
    $("submit-status").innerHTML = '<div class="status-banner">' + t.codeIntro +
      '<div class="code-box" id="sa-code">' + esc(code) + "</div>" +
      '<div class="btn-row">' +
      (mailtoHref ? '<a class="btn small" style="text-decoration:none" href="' + esc(mailtoHref) + '">' + esc(t.sendEmail) + "</a>" : "") +
      '<button class="btn ghost small" id="btn-copy-code">' + esc(t.copyCodeBtn) + '</button>' +
      "</div></div>";
    var cc = $("btn-copy-code");
    if (cc) cc.addEventListener("click", function () {
      var done = function () { cc.textContent = t.copied; setTimeout(function () { cc.textContent = t.copyCodeBtn; }, 1600); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(done, fallback);
      } else { fallback(); }
      function fallback() {
        var range = document.createRange();
        range.selectNodeContents($("sa-code"));
        var sel = window.getSelection();
        sel.removeAllRanges(); sel.addRange(range);
        try { document.execCommand("copy"); done(); } catch (e) {}
      }
    });
  }

  function retryPending() {
    if (!ART || !sessionActive()) return;
    var pending = lsGet("fq-pending-" + ARTIFACT_URL);
    if (!pending || !pending.id) return;
    if (SESSION.responses.some(function (r) { return r.id === pending.id; })) {
      lsDel("fq-pending-" + ARTIFACT_URL);
      return;
    }
    publishSession(withResponse(SESSION, pending)).then(function () {
      lsDel("fq-pending-" + ARTIFACT_URL);
    }, function () { /* conflict → reload retries again; not_writer → leave for manual code */ });
  }

  // ---------- start gating ----------
  function syncStart() {
    var t = T();
    if (STANDALONE) { $("btn-start").disabled = false; $("start-hint").textContent = ""; return; }
    if (sessionActive() && !forceSolo) return;
    var ok = $("org-name").value.trim().length > 0;
    $("btn-start").disabled = !ok;
    $("start-hint").textContent = ok ? "" : t.startHint;
    var bc = $("btn-create");
    if (bc) bc.disabled = !ok;
  }

  // ---------- wiring ----------
  $("lang-en").addEventListener("click", function () { setLang("en"); });
  $("lang-fr").addEventListener("click", function () { setLang("fr"); });
  $("org-name").addEventListener("input", syncStart);
  $("org-dept").addEventListener("change", function () {
    $("dept-other-field").hidden = $("org-dept").value !== "other";
  });
  $("btn-start").addEventListener("click", function () {
    if (STANDALONE) {
      MODE = "standalone";
      step = 0; renderSection(); show("survey");
      return;
    }
    if (!$("org-name").value.trim()) return;
    MODE = "solo";
    step = 0; renderSection(); show("survey");
  });
  $("btn-back").addEventListener("click", function () {
    if (step === 0) { show("intro"); } else { step--; renderSection(); }
  });
  $("btn-next").addEventListener("click", function () {
    if (!sectionComplete()) return;
    if (step === 3) {
      if (MODE === "respond") {
        renderResults("personal"); show("results");
        submitResponse();
      } else if (MODE === "standalone") {
        renderResults("personal"); show("results");
        renderStandaloneDone();
      } else {
        renderResults("solo"); show("results");
      }
    } else { step++; renderSection(); }
  });
  $("btn-restart").addEventListener("click", function () {
    QMETA.forEach(function (q) { answers[q.key] = [null, null, null, null, null, null]; });
    step = 0; MODE = "solo";
    renderIntroMode(); syncStart();
    show("intro");
  });
  $("btn-print").addEventListener("click", function () {
    var btn = $("btn-print");
    if (btn.disabled) return;
    var t = T();
    btn.disabled = true;
    btn.textContent = t.pdfPreparing;
    var reset = function () { btn.disabled = false; btn.textContent = T().btnDlReport; };
    var done = function () {
      btn.disabled = false;
      btn.textContent = T().reportSaved;
      setTimeout(function () { btn.textContent = T().btnDlReport; }, 2000);
    };
    withLightTheme(buildPdf).then(function (res) {
      if (!DL) { res.pdf.save(res.filename); done(); return; }
      return DL.save({ filename: res.filename, data: res.pdf.output("arraybuffer") }).then(done, function (e) {
        var code = e && e.code;
        if (code === "extension_not_enabled" || code === "rejected_extension") return saveHtmlReport(done).then(reset);
        reset();
      });
    }).catch(function () {
      reset();
      if (DL) saveHtmlReport(done); else { try { window.print(); } catch (err) {} }
    });
  });

  var mq = window.matchMedia("(prefers-color-scheme: dark)");
  if (mq.addEventListener) mq.addEventListener("change", function () {
    if (screens.results.classList.contains("active")) renderResults(RESULTS_MODE);
  });

  $("lang-en").classList.toggle("active", lang === "en");
  $("lang-fr").classList.toggle("active", lang === "fr");
  $("lang-en").setAttribute("aria-pressed", lang === "en");
  $("lang-fr").setAttribute("aria-pressed", lang === "fr");
  applyStatic();
  try { if (sessionStorage.getItem("fq-present") === "1" && sessionActive()) openPresent(); } catch (e) {}

  // resolve the artifact capability (arrives after first run; null when absent)
  if (!STANDALONE && window.claude && typeof window.claude.use === "function") {
    window.claude.use("artifact").then(function (ns) {
      ART = ns || null;
      renderIntroMode(); syncStart();
      if (activeScreen() === "results" && RESULTS_MODE === "live") renderAdmin();
      retryPending();
    }, function () { ART = null; });
    window.claude.use("downloads").then(function (ns) {
      DL = ns || null;
      if (DL) {
        if (activeScreen() === "intro") renderIntroMode();
        $("btn-print").textContent = T().btnDlReport;
      }
    }, function () { DL = null; });
  } else {
    ART = null; DL = null;
  }
})();
</script>
