<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Activity Diagnostic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=Instrument+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=swap">
<style>
  :root {
    --bg: #F6F3EF; --surface: #FDFBF8; --surface-2: #EFEAE3;
    --ink: #26221E; --ink-2: #5C554D; --ink-3: #8A827A;
    --line: #DDD6CC; --line-strong: #C4BBAE;
    --accent: #B4432A; --accent-ink: #FFFFFF; --accent-soft: rgba(180, 67, 42, 0.10);
    --track: #E7E1D8;
    --shadow: 0 1px 2px rgba(38, 34, 30, 0.05), 0 8px 28px rgba(38, 34, 30, 0.07);
    /* chart series: categories (automatable, augmented, human) and audiences (teams, leadership) */
    --c-auto: #2a78d6; --c-aug: #eb6834; --c-hum: #1baf7a;
    --c-teams: #6250d6; --c-lead: #eda100;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #191817; --surface: #211F1E; --surface-2: #2A2725;
      --ink: #ECE7E0; --ink-2: #B3ACA3; --ink-3: #7D766D;
      --line: #363330; --line-strong: #4A4540;
      --accent: #E0664A; --accent-ink: #1B1210; --accent-soft: rgba(224, 102, 74, 0.13);
      --track: #2E2B29;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 28px rgba(0, 0, 0, 0.35);
      --c-auto: #3987e5; --c-aug: #d95926; --c-hum: #199e70;
      --c-teams: #9085e9; --c-lead: #c98500;
    }
  }
  :root[data-theme="dark"] {
    --bg: #191817; --surface: #211F1E; --surface-2: #2A2725;
    --ink: #ECE7E0; --ink-2: #B3ACA3; --ink-3: #7D766D;
    --line: #363330; --line-strong: #4A4540;
    --accent: #E0664A; --accent-ink: #1B1210; --accent-soft: rgba(224, 102, 74, 0.13);
    --track: #2E2B29;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 28px rgba(0, 0, 0, 0.35);
    --c-auto: #3987e5; --c-aug: #d95926; --c-hum: #199e70;
    --c-teams: #9085e9; --c-lead: #c98500;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 800px; margin: 0 auto; padding: 2.5rem 1rem 5rem; position: relative; }

  .lang-switch {
    position: absolute; top: 2.3rem; right: 1rem;
    display: flex; border: 1px solid var(--line-strong); border-radius: 999px;
    overflow: hidden; background: var(--surface);
  }
  .lang-switch button {
    font: inherit; font-size: 0.74rem; font-weight: 600; letter-spacing: 0.06em;
    padding: 0.32rem 0.75rem; border: none; background: transparent; color: var(--ink-3); cursor: pointer;
  }
  .lang-switch button.active { background: var(--ink); color: var(--bg); cursor: default; }
  .lang-switch button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  .eyebrow {
    font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-3); font-weight: 600; margin: 0 0 0.75rem; padding-right: 7rem;
  }
  .eyebrow .mark { color: var(--accent); }
  h1, h2, h3 { font-family: "Fraunces", Georgia, serif; text-wrap: balance; margin: 0; }
  h1 { font-size: clamp(1.9rem, 5vw, 2.7rem); font-weight: 600; line-height: 1.12; letter-spacing: -0.01em; }
  h2 { font-size: 1.4rem; font-weight: 600; }
  h3 { font-size: 1.08rem; font-weight: 600; }
  h4 { font-size: 0.95rem; font-weight: 600; margin: 0 0 0.4rem; }
  p { margin: 0; }
  .lede { color: var(--ink-2); font-size: 1.04rem; max-width: 62ch; margin-top: 1rem; }
  ul.points { margin: 1.4rem 0 0; padding-left: 1.2rem; color: var(--ink-2); max-width: 60ch; }
  ul.points li { margin-bottom: 0.35rem; }
  .org-line { margin-top: 0.6rem; font-size: 0.98rem; color: var(--ink-2); }
  .org-line strong { color: var(--ink); font-weight: 600; }
  .org-line .sep { color: var(--ink-3); margin: 0 0.4em; }

  .btn {
    display: inline-flex; align-items: center; gap: 0.5em; text-decoration: none;
    font: inherit; font-weight: 600; font-size: 0.95rem; padding: 0.7rem 1.5rem;
    border-radius: 6px; border: 1px solid transparent; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); transition: filter 120ms ease;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn[disabled] { opacity: 0.45; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--ink-2); border-color: var(--line-strong); }
  .btn.ghost:hover { color: var(--ink); filter: none; border-color: var(--ink-3); }
  .btn.small { font-size: 0.84rem; padding: 0.5rem 1rem; }
  .linklike { background: none; border: none; font: inherit; font-size: 0.86rem; color: var(--ink-3); text-decoration: underline; cursor: pointer; padding: 0; }
  .linklike:hover { color: var(--ink); }

  .progress { margin: 0 0 2rem; }
  .progress-steps { display: flex; gap: 0.4rem; margin-bottom: 0.5rem; }
  .progress-steps .seg { flex: 1; height: 4px; border-radius: 2px; background: var(--track); }
  .progress-steps .seg.done { background: var(--accent); }
  .progress-note {
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.72rem; color: var(--ink-3);
    display: flex; justify-content: space-between; gap: 1rem;
  }

  .s-head { border-left: 3px solid var(--accent); padding-left: 1rem; margin-bottom: 1.4rem; }
  .s-head p { color: var(--ink-2); font-size: 0.95rem; margin-top: 0.4rem; max-width: 60ch; }

  .q { padding: 1.2rem 0; border-bottom: 1px solid var(--line); }
  .q:last-child { border-bottom: none; }
  .q .stmt { font-weight: 500; margin-bottom: 0.7rem; max-width: 62ch; }
  .q .stmt .opt { font-weight: 400; color: var(--ink-3); font-size: 0.88rem; }
  .q .help { font-size: 0.84rem; color: var(--ink-3); margin: -0.4rem 0 0.7rem; max-width: 62ch; }

  .choices { display: flex; flex-wrap: wrap; gap: 0.45rem; }
  .choices.stack { flex-direction: column; align-items: stretch; }
  .choices input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .choices label {
    display: block; padding: 0.5rem 0.85rem; border: 1px solid var(--line-strong); border-radius: 6px;
    background: var(--surface); color: var(--ink-2); font-size: 0.92rem; cursor: pointer; user-select: none;
    transition: border-color 100ms, background 100ms, color 100ms;
  }
  .choices label:hover { border-color: var(--ink-3); color: var(--ink); }
  .choices input:checked + label { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .choices input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
  .choices input:disabled + label { opacity: 0.4; cursor: not-allowed; }
  .choices.scale label { min-width: 2.6rem; text-align: center; font-family: "IBM Plex Mono", ui-monospace, monospace; }
  .scale-caps { display: flex; justify-content: space-between; font-size: 0.76rem; color: var(--ink-3); max-width: 16.5rem; margin-top: 0.3rem; }

  input[type="text"], textarea, select {
    width: 100%; font: inherit; font-size: 0.95rem; padding: 0.55rem 0.75rem;
    border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: var(--ink);
  }
  textarea { min-height: 4.6em; resize: vertical; }
  input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  input::placeholder, textarea::placeholder { color: var(--ink-3); opacity: 1; }
  .other-input { margin-top: 0.5rem; }
  .field { margin-bottom: 0.9rem; }
  .field label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--ink-2); margin-bottom: 0.3rem; }

  .act {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 1.1rem 1.2rem 0.4rem; margin-top: 1.2rem; box-shadow: var(--shadow);
  }
  .act-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
  .tag {
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.7rem; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--accent); font-weight: 600; display: block;
  }
  .act .q { padding: 0.9rem 0; }
  .act .q .stmt { font-size: 0.95rem; margin-bottom: 0.55rem; }
  .act .choices label { font-size: 0.86rem; padding: 0.42rem 0.7rem; }
  .add-row { margin-top: 1.2rem; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
  .add-row .hint { font-size: 0.84rem; color: var(--ink-3); }

  .agree-row { padding: 0.9rem 0; border-bottom: 1px dashed var(--line); }
  .agree-row:last-child { border-bottom: none; }
  .agree-row .stmt { margin-bottom: 0.55rem; }
  .agree-row .choices label { font-size: 0.82rem; padding: 0.4rem 0.6rem; }

  .nav-row { display: flex; justify-content: space-between; align-items: center; margin-top: 2rem; gap: 1rem; flex-wrap: wrap; }
  .nav-row .hint { font-size: 0.82rem; color: var(--ink-3); flex: 1; text-align: center; min-width: 10rem; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 1.4rem; margin-top: 1.4rem; box-shadow: var(--shadow); }
  .card > h3 { margin-bottom: 0.3rem; }
  .card .sub { font-size: 0.86rem; color: var(--ink-3); margin-bottom: 1.1rem; max-width: 64ch; }
  .card.dashed { border-style: dashed; box-shadow: none; }
  .card.live { border-color: var(--accent); }
  .status-banner { margin-top: 1.4rem; padding: 0.9rem 1.2rem; border-radius: 8px; background: var(--accent-soft); color: var(--ink-2); font-size: 0.92rem; }
  .status-banner strong { color: var(--ink); }
  .status-banner.err { outline: 1px solid var(--accent); }
  .code-box {
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.72rem; padding: 0.6rem;
    border: 1px solid var(--line-strong); border-radius: 6px; background: var(--bg); color: var(--ink-2);
    word-break: break-all; margin-top: 0.6rem; user-select: all; max-height: 8em; overflow-y: auto;
  }
  .btn-row { display: flex; gap: 0.7rem; flex-wrap: wrap; margin-top: 1rem; align-items: center; }
  .msg { font-size: 0.84rem; color: var(--ink-3); margin-top: 0.5rem; min-height: 1.2em; }
  .s-org { font-family: "Fraunces", Georgia, serif; font-size: 1.25rem; font-weight: 600; color: var(--ink); margin: 0.1rem 0 0.2rem; }
  .s-count { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.8rem; color: var(--accent); font-weight: 600; }

  .share { display: flex; gap: 1.2rem; align-items: flex-start; flex-wrap: wrap; margin-top: 0.6rem; }
  .share .qr { width: 148px; flex: none; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: #fff; }
  .share .qr.sm { width: 104px; }
  .share .qr svg { display: block; width: 100%; height: auto; }
  .share .share-right { flex: 1; min-width: 220px; }
  .share .code-box { margin-top: 0; }
  .share-block { padding: 1rem 0; border-top: 1px solid var(--line); }
  .share-block:first-of-type { border-top: none; }

  .archive-row { display: flex; align-items: center; justify-content: space-between; gap: 0.8rem; padding: 0.6rem 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .archive-row:first-of-type { border-top: none; }
  .archive-row .a-org { font-weight: 600; font-size: 0.92rem; }
  .archive-row .a-meta { font-size: 0.78rem; color: var(--ink-3); font-family: "IBM Plex Mono", ui-monospace, monospace; }

  /* results */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.8rem; margin-top: 1.6rem; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.1rem; }
  .tile .v { font-family: "Fraunces", Georgia, serif; font-size: 2rem; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .tile .v.accent { color: var(--accent); }
  .tile .l { font-size: 0.8rem; color: var(--ink-3); margin-top: 0.3rem; }

  .legend { display: flex; flex-wrap: wrap; gap: 0.4rem 1.1rem; font-size: 0.8rem; color: var(--ink-2); margin-bottom: 0.9rem; }
  .legend .key { display: inline-flex; align-items: center; gap: 0.4em; }
  .sw { display: inline-block; width: 0.7em; height: 0.7em; border-radius: 2px; flex: none; }
  .bars { display: grid; gap: 0.75rem; }
  .bar-row { display: grid; grid-template-columns: minmax(6rem, 13rem) 1fr; gap: 0.3rem 0.9rem; align-items: center; }
  .bar-row .name { font-size: 0.88rem; color: var(--ink); line-height: 1.3; }
  .bar-row .name small { display: block; color: var(--ink-3); font-size: 0.76rem; }
  .bar-line { display: flex; align-items: center; gap: 0.5rem; min-width: 0; }
  .bar-line + .bar-line { margin-top: 3px; }
  .track { flex: 1; display: flex; gap: 2px; height: 14px; min-width: 0; }
  .track.thin { height: 10px; }
  .fill { height: 100%; min-width: 2px; }
  .track .fill:last-of-type { border-radius: 0 4px 4px 0; }
  .val { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.76rem; color: var(--ink-2); white-space: nowrap; min-width: 3.2em; text-align: right; }
  .breakdown { grid-column: 2; font-size: 0.76rem; color: var(--ink-3); }
  .bar-row.solo { grid-template-columns: 1fr; }
  .bar-row.solo .breakdown { grid-column: 1; }
  .breakdown span + span::before { content: " · "; }
  .muted { color: var(--ink-3); }
  .fill.rest { background: var(--track); }
  .fill.light { opacity: 0.4; }
  .save-hero { font-family: "Fraunces", Georgia, serif; font-size: clamp(1.6rem, 4.5vw, 2.2rem); font-weight: 700; line-height: 1.15; margin: 0.2rem 0 0.4rem; }
  .save-hero b { color: var(--accent); }
  .split { display: flex; flex-wrap: wrap; gap: 0.5rem 1.4rem; font-size: 0.88rem; color: var(--ink-2); margin: 0.4rem 0 1rem; }
  .split strong { color: var(--ink); font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.84rem; }
  .method { font-size: 0.8rem; color: var(--ink-3); margin-top: 1rem; max-width: 66ch; }

  .chip { display: inline-flex; align-items: center; gap: 0.35em; font-size: 0.74rem; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
  .alist { list-style: none; margin: 0; padding: 0; }
  .alist li { display: grid; grid-template-columns: 1fr auto; gap: 0.2rem 1rem; padding: 0.6rem 0; border-top: 1px solid var(--line); align-items: baseline; }
  .alist li:first-child { border-top: none; }
  .alist .a-n { font-weight: 500; }
  .alist .a-m { font-size: 0.78rem; color: var(--ink-3); grid-column: 1 / -1; display: flex; gap: 0.9rem; flex-wrap: wrap; }
  .alist .a-h { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.8rem; color: var(--ink-2); }

  table.rt { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
  .rt th, .rt td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  .rt th { font-weight: 600; color: var(--ink-2); font-size: 0.78rem; }
  .rt td.num, .rt th.num { text-align: right; font-variant-numeric: tabular-nums; font-family: "IBM Plex Mono", ui-monospace, monospace; }

  .levers { display: grid; gap: 1.1rem; }
  .lever { border-top: 1px solid var(--line); padding-top: 1rem; }
  .lever:first-child { border-top: none; padding-top: 0; }
  .lever .l-tag { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; display: block; margin-bottom: 0.3rem; }
  .lever p { font-size: 0.93rem; color: var(--ink-2); }
  .lever .decide { margin-top: 0.5rem; font-size: 0.9rem; color: var(--ink); padding-left: 0.9rem; border-left: 2px solid var(--accent); }
  .lever .decide b { color: var(--accent); }

  .admin-box { margin-top: 1.4rem; padding: 1.2rem 1.4rem; background: var(--surface-2); border-radius: 8px; }

  .tooltip {
    position: fixed; pointer-events: none; z-index: 70; background: var(--ink); color: var(--bg);
    font-size: 0.78rem; font-weight: 500; padding: 0.35rem 0.6rem; border-radius: 5px;
    opacity: 0; transition: opacity 100ms; max-width: 18rem;
  }
  .tooltip.show { opacity: 1; }

  .present-overlay {
    position: fixed; inset: 0; z-index: 60; background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.1rem; padding: 2rem; text-align: center; cursor: pointer;
  }
  .present-overlay .p-org { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: clamp(1.8rem, 4.5vw, 3.2rem); line-height: 1.1; }
  .present-overlay .p-qr { width: min(56vh, 82vw); background: #fff; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
  .present-overlay .p-qr svg { display: block; width: 100%; height: auto; }
  .present-overlay .p-scan { font-size: clamp(1.1rem, 2.6vw, 1.7rem); font-weight: 600; color: var(--ink-2); }
  .present-overlay .p-url { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: clamp(0.75rem, 1.6vw, 1rem); color: var(--ink-3); word-break: break-all; max-width: 90vw; }
  .present-overlay .p-exit { position: fixed; top: 1rem; right: 1.4rem; font-size: 0.8rem; color: var(--ink-3); }

  .foot { margin-top: 3rem; padding-top: 1.2rem; border-top: 1px solid var(--line); font-size: 0.8rem; color: var(--ink-3); max-width: 62ch; }
  .screen { animation: fade 240ms ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .screen { animation: none; } }
  @media (max-width: 560px) {
    .eyebrow { padding-right: 6rem; }
    .nav-row .hint { order: 3; flex-basis: 100%; }
    .bar-row { grid-template-columns: 1fr; }
    .breakdown { grid-column: 1; }
  }
  @media print { .btn, .nav-row, .lang-switch, .linklike, .no-pdf { display: none !important; } body { background: #fff; color: #111; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="lang-switch" role="group" aria-label="Language / Langue">
    <button id="lang-en" class="active" aria-pressed="true">EN</button>
    <button id="lang-fr" aria-pressed="false">FR</button>
  </div>
  <main id="app"></main>
  <p class="foot" id="foot"></p>
</div>
<div class="tooltip" id="tooltip" role="status"></div>

<script type="application/json" id="aia-data">{"v": 1, "standalone": {"universal": true}}</script>

  function filled(v) { return v != null && v !== "" && !(Array.isArray(v) && !v.length); }
  function h1(n) { return (Math.round(n * 10) / 10).toLocaleString(lang === "fr" ? "fr-CA" : "en-CA"); }
  function pct(n) { return Math.round(n) + " %"; }
  function rid() {
    var a = new Uint8Array(6);
    if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(a);
    else for (var i = 0; i < a.length; i++) a[i] = Math.floor(Math.random() * 256);
    return Array.prototype.map.call(a, function (b) { return (b < 16 ? "0" : "") + b.toString(16); }).join("");
  }
  function b64urlEncode(str) { return btoa(unescape(encodeURIComponent(str))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
  function b64urlDecode(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    return decodeURIComponent(escape(atob(s)));
  }
  function dateStr(ts) {
    return new Date(ts || Date.now()).toLocaleDateString(lang === "fr" ? "fr-CA" : "en-CA", { year: "numeric", month: "long", day: "numeric" });
  }

  // Survey settings: from the session in the artifact, from the link on the public page.

    if (SESSION) return { org: SESSION.org, roles: SESSION.roles || [], min: SESSION.min || 5, to: SESSION.email || DEFAULT_TO };
    return { org: "", roles: [], min: 5, to: DEFAULT_TO };

  function orgName() { return cfg().org || T("ourOrg"); }
  function roles() { var r = cfg().roles; return r.length ? r : DEFAULT_ROLES[lang]; }
  function tx(k, o) { return fmt(T(k), Object.assign({ org: esc(orgName()), min: cfg().min }, o || {})); }

  // ============ form definition ============
  // Field keys stay short: they end up in the response code.

  var STEPS = {

      { title: "sActs", sub: "sActsSubT", acts: { lo: 3, hi: 7 } },

  // ============ app state ============
  // view: intro | survey | personal | group | facilitator
  // mode: standalone (public link) | respond (in a live session) | solo (trying it, nothing saved)
  var view = "intro", mode = STANDALONE ? "standalone" : "solo";
  var FORM = STANDALONE ? P.form : "t";

  function draftKey() { return "aia-draft:" + FORM + ":" + (cfg().org || ""); }
  function freshState() {

  // ============ classification (decision tree, section 6.3 — proposals only) ============
  // 1. serious consequence of an error → human to keep
  // 2. confidential data (or unsure) → augmented at most, pending data rules
  // 3. always the same way + minor consequence → automatable
  // 4. otherwise → augmented
  function classify(x) {
    if (x.e === 2) return "hum";
    if (x.c === 0 || x.c === 2) return "augData";
    if (x.s === 2 && x.e === 0) return "auto";
    return "aug";
  }
  function bucket(c) { return c === "augData" ? "aug" : c; }
  var CAT_LABEL = { auto: "catAuto", aug: "catAug", augData: "catAugData", hum: "catHum" };
  var CAT_SHORT = { auto: "catAutoS", aug: "catAugS", hum: "catHumS" };
  var CAT_VAR = { auto: "--c-auto", aug: "--c-aug", hum: "--c-hum" };
  // Time AI could save, as a low–high share of the activity's weekly hours (section 7.1
  // hypotheses, to be validated in the pilot): agents for automatable work, assistants
  // scaled by how repetitive the work is, nothing for work that stays human.
  function helpType(x) { var c = classify(x); return c === "auto" ? "agent" : c === "hum" ? "human" : "assistant"; }
  function saveRate(x) {
    var t = helpType(x);
    if (t === "human") return [0, 0];
    if (t === "agent") return [0.5, 0.7];
    return x.s === 2 ? [0.3, 0.5] : x.s === 1 ? [0.2, 0.4] : [0.1, 0.25];
  }
  function savedOf(x) { var r = saveRate(x), h = HOURS_MID[x.h] || 0; return [h * r[0], h * r[1]]; }
  function savingsOf(acts) {
    var s = { agent: [0, 0], assistant: [0, 0], total: [0, 0], hours: 0 };
    acts.forEach(function (x) {
      var v = savedOf(x), t = helpType(x);
      s.hours += HOURS_MID[x.h] || 0;
      if (t === "human") return;
      s[t][0] += v[0]; s[t][1] += v[1]; s.total[0] += v[0]; s.total[1] += v[1];
    });
    return s;
  }
  function half(v) { return Math.round(v * 2) / 2; }
  function hr(r, perWeek) {
    var lo = half(r[0]), hi = half(r[1]);
    var txt = lo === hi ? "≈ " + h1(lo) : h1(lo) + "–" + h1(hi);
    return txt + " " + (perWeek ? T("hpw") : "h");
  }
  var HELP_VAR = { agent: "--c-auto", assistant: "--c-aug" };
  var HELP_LABEL = { agent: "helpAgent", assistant: "helpAssist", human: "helpHuman" };
  function helpChip(x) {
    var t = helpType(x);
    return '<span class="chip">' + (t === "human" ? sw("--c-hum") : sw(HELP_VAR[t])) + esc(T(HELP_LABEL[t])) + "</span>" +
      (t !== "human" && (x.c === 0 || x.c === 2) ? '<span>' + tx("approved") + "</span>" : "");
  }
  function helpLegend() {
    return '<div class="legend"><span class="key">' + sw("--c-auto") + "<span><b>" + esc(T("helpAgent")) + "</b> — " + esc(T("helpAgentD")) + "</span></span>" +
      '<span class="key">' + sw("--c-aug") + "<span><b>" + esc(T("helpAssist")) + "</b> — " + esc(T("helpAssistD")) + "</span></span></div>";
  }
  // One bar: current hours scaled to max; saved low (solid) and up to high (light) in the help color.
  function saveBar(parts, hours, max) {
    var html = "", used = 0;
    parts.forEach(function (pt) {
      if (pt.lo > 0) html += '<div class="fill" style="width:' + (100 * pt.lo / max).toFixed(2) + '%;background:var(' + pt.v + ')" data-tip="' + esc(pt.tip) + '"></div>';
      if (pt.hi - pt.lo > 0) html += '<div class="fill light" style="width:' + (100 * (pt.hi - pt.lo) / max).toFixed(2) + '%;background:var(' + pt.v + ')" data-tip="' + esc(pt.tip) + '"></div>';
      used += pt.hi;
    });
    if (hours - used > 0.01) html += '<div class="fill rest" style="width:' + (100 * (hours - used) / max).toFixed(2) + '%"></div>';
    return '<div class="track">' + html + '<span style="width:' + (100 * Math.max(0, max - hours) / max).toFixed(2) + '%"></span></div>';
  }
  function hoursOf(acts) {
    var h = { auto: 0, aug: 0, hum: 0 };
    acts.forEach(function (x) { h[bucket(classify(x))] += HOURS_MID[x.h] || 0; });
    h.total = h.auto + h.aug + h.hum;
    return h;
  }

  // ============ survey rendering ============
  function choiceGroup(name, opts, val, multi, extra) {
    extra = extra || {};
    var cls = "choices" + (extra.stack ? " stack" : "") + (extra.scale ? " scale" : "");
    var atMax = multi && extra.max && Array.isArray(val) && val.length >= extra.max;
    return '<div class="' + cls + '" role="' + (multi ? "group" : "radiogroup") + '">' + opts.map(function (o, i) {
      var id = name + "-" + i;
      var on = multi ? (Array.isArray(val) && val.indexOf(i) >= 0) : val === i;
      return '<input type="' + (multi ? "checkbox" : "radio") + '" id="' + id + '" name="' + name + '" value="' + i + '"' +
        (on ? " checked" : "") + (atMax && !on ? " disabled" : "") + '><label for="' + id + '">' + esc(o) + "</label>";
    }).join("") + "</div>";
  }

  function qBlock(q, a) {
    var head = '<p class="stmt" id="lbl-' + q.k + '">' + tx(q.q) + (q.req ? " *" : ' <span class="opt">' + esc(T("optional")) + "</span>") + "</p>" +
      (q.help ? '<p class="help">' + tx(q.help) + "</p>" : "");
    var v = a[q.k], body = "";
    switch (q.type) {
      case "role":
        body = choiceGroup(q.k, roles().concat([T("prefNot")]), v, false, { stack: true });
        break;
      case "one":
        body = choiceGroup(q.k, T(q.o), v, false, { stack: q.stack });
        break;
      case "many":
        body = '<p class="help">' + esc(fmt(T("upTo"), { n: q.max })) + "</p>" +
          choiceGroup(q.k, T(q.o).concat(q.other ? [T("other")] : []), v, true, { stack: true, max: q.max });
        if (q.other) {
          var otherOn = Array.isArray(v) && v.indexOf(T(q.o).length) >= 0;
          body += '<input type="text" class="other-input" data-k="' + q.k + 'o" maxlength="200" placeholder="' + esc(T("otherPh")) + '" value="' + esc(a[q.k + "o"] || "") + '"' + (otherOn ? "" : " hidden") + ">";
        }
        break;
      case "scale":
        body = choiceGroup(q.k, ["1", "2", "3", "4", "5"], v == null ? null : v - 1, false, { scale: true }) +
          '<div class="scale-caps"><span>' + esc(T("feelLo")) + "</span><span>" + esc(T("feelHi")) + "</span></div>";
        break;
      case "agree":
        body = q.rows.map(function (r, i) {
          var vv = Array.isArray(v) ? v[i] : null;
          return '<div class="agree-row"><p class="stmt">' + tx(r) + "</p>" + choiceGroup(q.k + "_" + i, T("agree"), vv, false) + "</div>";
        }).join("");
        break;
      case "short":
        body = '<input type="text" data-k="' + q.k + '" maxlength="200" aria-labelledby="lbl-' + q.k + '" value="' + esc(v || "") + '">';
        break;
      case "long":
        body = '<textarea data-k="' + q.k + '" maxlength="1500" aria-labelledby="lbl-' + q.k + '">' + esc(v || "") + "</textarea>";
        break;
    }
    return '<div class="q">' + head + body + "</div>";
  }

  function actCard(act, i, canRemove) {
    return '<div class="act" data-i="' + i + '">' +
      '<div class="act-head"><span class="tag">' + esc(fmt(T("act"), { n: i + 1 })) + "</span>" +
      (canRemove ? '<button class="linklike" data-act="rm" data-i="' + i + '">' + esc(T("remove")) + "</button>" : "") + "</div>" +
      '<div class="q"><p class="stmt" id="lbl-a' + i + '">' + esc(T("aName")) + ' *</p><input type="text" data-act-i="' + i + '" data-k="n" maxlength="160" aria-labelledby="lbl-a' + i + '" placeholder="' + esc(T("aNamePh")) + '" value="' + esc(act.n || "") + '"></div>' +
      ACT_FIELDS.map(function (f) {
        return '<div class="q"><p class="stmt">' + tx(f.q) + " *</p>" + (f.help ? '<p class="help">' + esc(T(f.help)) + "</p>" : "") +
          choiceGroup("a" + i + "_" + f.k, T(f.o), act[f.k], false) + "</div>";
      }).join("") + "</div>";
  }

  function stepValid(step) {
    var a = state.a;
    if (step.acts) {
      return a.acts.length >= step.acts.lo && a.acts.every(function (x) {
        return filled((x.n || "").trim()) && ACT_FIELDS.every(function (f) { return x[f.k] != null; });
      });
    }
    return step.qs.every(function (q) {
      if (!q.req) return true;
      if (q.type === "agree") return Array.isArray(a[q.k]) && q.rows.every(function (_, i) { return a[q.k][i] != null; });
      if (q.type === "short" || q.type === "long") return filled((a[q.k] || "").trim());
      return filled(a[q.k]);
    });
  }

  function renderSurveyIntro() {
    var draft = lsGet(draftKey());
    var hasDraft = draft && draft.step >= 0 && draft.a;

      '<p class="eyebrow"><span class="mark">MR5</span> · ' + esc(T(FORM === "t" ? "eyebrowT" : "eyebrowD")) + (cfg().org ? " · " + esc(cfg().org) : "") + "</p>" +
      "<h1>" + esc(T(FORM === "t" ? "titleT" : "titleD")) + "</h1>" +

        ? '<button class="btn" data-act="resume">' + esc(T("resume")) + '</button><button class="btn ghost" data-act="start">' + esc(T("restart")) + "</button>"
        : '<button class="btn" data-act="start">' + esc(T("start")) + "</button>") +
      "</div></section>";

  function renderStep() {
    var steps = STEPS[FORM], step = steps[state.step], a = state.a;
    var segs = steps.map(function (_, i) { return '<div class="seg' + (i <= state.step ? " done" : "") + '"></div>'; }).join("");
    var body;
    if (step.acts) {
      var canRemove = a.acts.length > step.acts.lo;
      body = '<div class="s-head"><h2>' + esc(T(step.title)) + "</h2><p>" + esc(fmt(T(step.sub), step.acts)) + "</p><p>" + esc(T("actEx")) + "</p></div>" +
        a.acts.map(function (x, i) { return actCard(x, i, canRemove); }).join("") +
        '<div class="add-row">' + (a.acts.length < step.acts.hi ? '<button class="btn ghost small" data-act="add">' + esc(T("addAct")) + "</button>" : "") +
        '<span class="hint">' + esc(fmt(T("actsLeft"), { n: a.acts.length, hi: step.acts.hi })) + "</span></div>";
    } else {
      body = '<div class="s-head"><h2>' + tx(step.title) + "</h2></div>" + step.qs.map(function (q) { return qBlock(q, a); }).join("");

      '<span class="hint" id="nav-hint"></span>' +

  }

  function updateNext() {
    if (view !== "survey") return;
    var ok = stepValid(STEPS[FORM][state.step]);
    var b = $("btn-next");
    if (b) b.disabled = !ok;
    var h = $("nav-hint");
    if (h) h.textContent = ok ? "" : T("required");
  }

  // ============ response payload / code ============
  function buildPayload() {
    var a = state.a, out = { v: 1, f: FORM, id: state.id, d: new Date().toISOString().slice(0, 10), l: lang };
    if (cfg().org) out.org = cfg().org;
    if (FORM === "t" && a.role != null) {
      var rl = roles();
      out.role = a.role < rl.length ? rl[a.role] : "";
    }
    Object.keys(a).forEach(function (k) {
      if (k === "role" || k === "acts") return;
      var v = a[k];
      if (typeof v === "string") v = v.trim();
      if (filled(v)) out[k] = v;
    });
    out.acts = a.acts.map(function (x) {
      var o = { n: (x.n || "").trim() };
      ACT_FIELDS.forEach(function (f) { o[f.k] = x[f.k]; });
      return o;
    });
    return out;
  }
  function encodeCode(p) { return CODE_PREFIX + b64urlEncode(JSON.stringify(p)); }
  function decodeCode(c) {
    try {
      var r = JSON.parse(b64urlDecode(c.slice(CODE_PREFIX.length)));
      if (!r || r.v !== 1 || !r.id || (r.f !== "t" && r.f !== "d") || !Array.isArray(r.acts)) return null;
      var okActs = r.acts.every(function (x) {
        return x && typeof x.n === "string" && ACT_FIELDS.every(function (f) { return typeof x[f.k] === "number" && x[f.k] >= 0 && x[f.k] < T(f.o).length; });
      });
      return okActs ? r : null;
    } catch (e) { return null; }
  }
  function parseCodes(text, existing) {
    var raw = String(text || "").match(/AIA1\.[A-Za-z0-9_-]+/g) || [];
    var seen = {}, out = [], bad = 0, dup = 0;
    (existing || []).forEach(function (r) { seen[r.id] = true; });
    raw.forEach(function (c) {
      var r = decodeCode(c);
      if (!r) { bad++; return; }
      if (seen[r.id]) { dup++; return; }
      seen[r.id] = true; out.push(r);
    });
    return { valid: out, bad: bad, dup: dup };
  }

  // ============ charts (HTML bars; values always printed beside the marks) ============
  function sw(varName) { return '<span class="sw" style="background:var(' + varName + ')"></span>'; }
  function catLegend() {

  function stackRow(name, sub, h, max) {

        esc(T(CAT_SHORT[c]) + " · " + h1(h[c]) + " " + T("hpw")) + '"></div>';
    }).join("");
    var rest = max ? 100 * (max - h.total) / max : 0;
    return '<div class="bar-row' + (name ? "" : " solo") + '">' + (name ? '<div class="name">' + esc(name) + (sub ? "<small>" + esc(sub) + "</small>" : "") + "</div>" : "") +
      '<div class="bar-line"><div class="track">' + segs + '<span style="width:' + rest.toFixed(2) + '%"></span></div>' +
      '<span class="val">' + h1(h.total) + " h</span></div>" +
      '<div class="breakdown">' + ["auto", "aug", "hum"].map(function (c) {
        return "<span>" + esc(T(CAT_SHORT[c])) + " " + h1(h[c]) + " h</span>";
      }).join("") + "</div></div>";

  function pairRows(labels, a, b, showB) {
    return '<div class="bars">' + labels.map(function (l, i) {
      function line(v, varName, who) {
        if (v == null) return "";

          esc(who + " · " + pct(v)) + '"></div></div><span class="val">' + pct(v) + "</span></div>";

      return '<div class="bar-row"><div class="name">' + esc(l) + "</div><div>" +
        line(a[i], "--c-teams", T("cTeams")) + (showB ? line(b[i], "--c-lead", T("cDir")) : "") + "</div></div>";

  function audienceLegend(nt, nd) {

      (nd ? '<span class="key">' + sw("--c-lead") + esc(T("cDir")) + " (" + nd + ")</span>" : "") + "</div>";
  }
  function shareOf(list, k, i) {
    if (!list.length) return null;
    return 100 * list.filter(function (r) { return Array.isArray(r[k]) && r[k].indexOf(i) >= 0; }).length / list.length;
  }
  function chip(c) { return '<span class="chip">' + sw(CAT_VAR[bucket(c)]) + esc(T(CAT_LABEL[c])) + "</span>"; }

  // ============ personal results ============
  function renderPersonal() {
    var p = lastPayload, h = hoursOf(p.acts), sv = savingsOf(p.acts);
    var help = h.auto + h.aug, hp = h.total ? 100 * help / h.total : 0;
    var acts = p.acts.map(function (x) { return { x: x, c: classify(x) }; })
      .sort(function (m, n) { return (HOURS_MID[n.x.h] || 0) - (HOURS_MID[m.x.h] || 0); });
    var prio = (p.re || []).map(function (i) { return i < T("reinvest").length ? T("reinvest")[i] : (p.reo || T("other")); });
    var back = mode === "respond" || mode === "solo";
    return '<section class="screen" id="report-root">' +
      '<p class="eyebrow"><span class="mark">MR5</span> · ' + esc(T("yEyebrow")) + "</p>" +
      "<h1>" + esc(T("yTitle")) + "</h1>" +
      '<p class="org-line">' + (cfg().org ? "<strong>" + esc(cfg().org) + '</strong><span class="sep">·</span>' : "") +
      (p.role ? esc(p.role) + '<span class="sep">·</span>' : "") + esc(dateStr()) + "</p>" +
      '<p class="lede">' + esc(T("yLede")) + "</p>" +
      '<div class="tiles">' +
      '<div class="tile"><div class="v">' + h1(h.total) + '</div><div class="l">' + esc(T("yTiles")[0]) + "</div></div>" +
      '<div class="tile"><div class="v accent">' + hr(sv.total) + '</div><div class="l">' + esc(T("yTilesS")) + "</div></div>" +
      '<div class="tile"><div class="v">' + p.acts.length + '</div><div class="l">' + esc(T("yTiles")[2]) + "</div></div></div>" +
      personalSavings(p, sv) +
      '<div class="card"><h3>' + esc(T("yWeek")) + '</h3><p class="sub">' + esc(help ? fmt(T("yHelp"), { h: h1(help), p: Math.round(hp) }) : T("yHelpNone")) + "</p>" +
      catLegend() + '<div class="bars">' + stackRow("", "", h, h.total) + "</div></div>" +
      '<div class="card"><h3>' + esc(T("yActs")) + '</h3><ul class="alist">' + acts.map(function (m) {
        return '<li><span class="a-n">' + esc(m.x.n) + '</span><span class="a-h">' + esc(T("hours")[m.x.h]) + "</span>" +
          '<span class="a-m">' + chip(m.c) + "</span></li>";
      }).join("") + "</ul></div>" +
      (prio.length ? '<div class="card"><h3>' + esc(T("yPrio")) + '</h3><ul class="points" style="margin-top:0.4rem">' +
        prio.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul></div>" : "") +
      '<div class="card dashed"><h3>' + esc(T("yNext")) + '</h3><p class="sub" style="margin:0.3rem 0 0">' +
        esc(fmt(T(p.f === "d" ? "yNextTextD" : "yNextText"), { min: cfg().min })) + "</p></div>" +
      '<div id="submit-status" class="no-pdf">' + submitHTML + "</div>" +
      '<div class="nav-row no-pdf" style="justify-content:flex-start;gap:0.8rem">' +
      '<button class="btn ghost" data-act="report">' + esc(T("btnReport")) + "</button>" +
      (back ? '<button class="btn ghost" data-act="to-intro">' + esc(T("btnBackConsole")) + "</button>"
            : '<button class="linklike" data-act="edit">' + esc(T("editAgain")) + "</button>") +
      "</div></section>";
  }

  function personalSavings(p, sv) {
    var rows = p.acts.slice().sort(function (m, n) { return savedOf(n)[1] - savedOf(m)[1] || (HOURS_MID[n.h] || 0) - (HOURS_MID[m.h] || 0); });
    var max = 0; rows.forEach(function (x) { max = Math.max(max, HOURS_MID[x.h] || 0); });
    var sp = sv.hours ? [100 * sv.total[0] / sv.hours, 100 * sv.total[1] / sv.hours] : [0, 0];
    var spTxt = Math.round(sp[0]) === Math.round(sp[1]) ? pct(sp[0]) : Math.round(sp[0]) + "–" + pct(sp[1]);
    return '<div class="card"><h3>' + esc(T("sTitle")) + "</h3>" +
      (sv.total[1] > 0
        ? '<p class="save-hero">' + fmt(T("sHero"), { r: esc(hr(sv.total)) }) + "</p>" +
          '<p class="sub" style="margin-bottom:0.4rem">' + esc(fmt(T("sShare"), { p: spTxt, h: h1(sv.hours) })) + "</p>" +
          '<div class="split"><span>' + sw("--c-auto") + " " + esc(T("sSplit")) + " <strong>" + esc(hr(sv.agent)) + "</strong></span>" +
          "<span>" + sw("--c-aug") + " " + esc(T("sSplit2")) + " <strong>" + esc(hr(sv.assistant)) + "</strong></span></div>"
        : '<p class="sub">' + esc(T("sHeroNone")) + "</p>") +
      helpLegend() +
      '<div class="bars">' + rows.map(function (x) {
        var t = helpType(x), v = savedOf(x), hrs = HOURS_MID[x.h] || 0;
        var parts = t === "human" ? [] : [{ lo: v[0], hi: v[1], v: HELP_VAR[t], tip: T(HELP_LABEL[t]) + " · " + fmt(T("sSaves"), { r: hr(v, true) }) }];
        return '<div class="bar-row"><div class="name">' + esc(x.n) + '<small class="a-m" style="display:flex;gap:0.6rem;flex-wrap:wrap">' + helpChip(x) + "</small></div>" +
          '<div class="bar-line">' + saveBar(parts, hrs, max) + '<span class="val">' + (t === "human" ? "–" : esc(hr(v))) + "</span></div>" +
          '<div class="breakdown"><span>' + esc(t === "human" ? T("helpHuman") : fmt(T("sSaves"), { r: hr(v, true) })) + "</span><span>" + esc(fmt(T("sOf"), { h: h1(hrs) })) + "</span></div></div>";
      }).join("") + "</div>" +
      '<p class="method">' + esc(T("sMethod")) + "</p></div>";
  }

  function standaloneCodeHTML(p) {
    var code = encodeCode(p);
    var org = cfg().org;
    var body = fmt(T("emailBody"), { org: org ? " (" + org + ")" : "", code: code });
    var mail = "mailto:" + encodeURIComponent(cfg().to) + "?subject=" + encodeURIComponent(T("emailSubject") + (org ? " – " + org : "")) + "&body=" + encodeURIComponent(body);
    return '<div class="status-banner">' + T("codeIntro") +
      '<div class="code-box" id="code">' + esc(code) + "</div>" +
      '<div class="btn-row"><a class="btn small" href="' + esc(mail) + '">' + esc(T("email")) + '</a>' +
      '<button class="btn ghost small" data-act="copy-code">' + esc(T("copy")) + "</button></div>" +
      '<p class="msg" id="copy-msg" role="status"></p>' +
      (p.f === "t" ? '<p style="margin-top:0.6rem;font-size:0.84rem">' + tx("codeAnon") + "</p>" : "") + "</div>";
  }

  // ============ group results ============
  function groupData(responses, min) {
    var teams = responses.filter(function (r) { return r.f === "t"; });
    var dirs = responses.filter(function (r) { return r.f === "d"; });
    var groups = {}, order = [];
    teams.forEach(function (r) {
      var g = r.role || T("prefNot");
      if (!groups[g]) { groups[g] = []; order.push(g); }
      groups[g].push(r);
    });
    var rows = [], pooled = [];
    order.forEach(function (g) { (groups[g].length >= min ? rows : pooled).push({ name: g, list: groups[g] }); });
    if (pooled.length) {
      var all = []; pooled.forEach(function (p) { all = all.concat(p.list); });
      rows.push({ name: fmt(T("cPooled"), { min: min }), list: all, pooled: true });
    }
    // Activity text is shown only from groups that reach the minimum size.
    var eligible = [];
    rows.forEach(function (row) { if (row.list.length >= min) eligible = eligible.concat(row.list.map(function (r) { return { r: r, g: row.pooled ? "" : row.name }; })); });
    return { teams: teams, dirs: dirs, rows: rows, eligible: eligible };
  }

  function renderGroupBody(responses, min) {
    var G = groupData(responses, min);
    var allActs = [];
    responses.forEach(function (r) { allActs = allActs.concat(r.acts); });
    var H = hoursOf(allActs);
    var SV = savingsOf(allActs);
    var helpP = H.total ? 100 * (H.auto + H.aug) / H.total : 0;

    // Where the time goes
    var timeRows = [];
    var maxT = 0;
    var shown = G.rows.map(function (row) {
      var acts = []; row.list.forEach(function (r) { acts = acts.concat(r.acts); });
      var h = hoursOf(acts); if (row.list.length >= min && h.total > maxT) maxT = h.total;
      return { row: row, h: h };
    });
    var dh = null;
    if (G.dirs.length) {
      var dacts = []; G.dirs.forEach(function (r) { dacts = dacts.concat(r.acts); });
      dh = hoursOf(dacts); if (dh.total > maxT) maxT = dh.total;
    }
    shown.forEach(function (s) {
      var n = s.row.list.length;
      if (n >= min) timeRows.push(stackRow(s.row.name, n + " · " + s.row.list.reduce(function (t, r) { return t + r.acts.length; }, 0) + " act.", s.h, maxT));
      else timeRows.push('<div class="bar-row"><div class="name">' + esc(s.row.name) + "<small>" + n + '</small></div><div class="muted" style="font-size:0.82rem">' + esc(fmt(T("cHidden"), { min: min })) + "</div></div>");
    });
    if (dh) timeRows.push(stackRow(T("cLead"), G.dirs.length + "", dh, maxT));

    // Candidates and keep-human lists (eligible team groups only)
    var cand = [], keep = [];
    G.eligible.forEach(function (e) {
      e.r.acts.forEach(function (x) {
        var c = classify(x);
        var item = { x: x, c: c, g: e.g, h: HOURS_MID[x.h] || 0 };
        if (c !== "hum" && x.w !== 2) cand.push(item);
        if (c === "hum") keep.push(item);
      });
    });
    var byH = function (m, n) { return n.h - m.h || (m.c === "auto" ? -1 : 1); };
    cand.sort(byH); keep.sort(byH);
    function alist(items) {
      if (!items.length) return '<p class="muted" style="font-size:0.9rem">' + esc(T("cNone")) + "</p>";
      return '<ul class="alist">' + items.map(function (m) {
        return '<li><span class="a-n">' + esc(m.x.n) + '</span><span class="a-h">' + esc(T("hours")[m.x.h]) + "</span>" +
          '<span class="a-m">' + chip(m.c) + (m.g ? "<span>" + esc(m.g) + "</span>" : "") + "</span></li>";
      }).join("") + "</ul>";
    }

    // Shares (teams vs leadership)
    var nt = G.teams.length, nd = G.dirs.length;
    function shares(k, optKey, list) { return T(optKey).map(function (_, i) { return shareOf(list, k, i); }); }
    var reT = shares("re", "reinvest", G.teams), reD = shares("re", "reinvest", G.dirs);
    var coT = shares("co", "concerns", G.teams), coD = shares("co", "concerns", G.dirs);
    var trT = shares("tr", "train", G.teams);

    // Readiness
    function avgAgree(list, idx) {
      var v = list.map(function (r) { return Array.isArray(r.ag) ? r.ag[idx] : null; }).filter(function (x) { return x != null && x < 5; });
      return v.length ? v.reduce(function (s, x) { return s + x + 1; }, 0) / v.length : null;
    }
    function shareAgree(list, idx) {
      var v = list.map(function (r) { return Array.isArray(r.ag) ? r.ag[idx] : null; }).filter(function (x) { return x != null && x < 5; });
      return v.length ? 100 * v.filter(function (x) { return x >= 3; }).length / v.length : null;
    }
    var usedWork = nt ? 100 * G.teams.filter(function (r) { return r.ai === 2 || r.ai === 3; }).length / nt : null;
    var feels = G.teams.map(function (r) { return r.feel; }).filter(function (x) { return x != null; });
    var feelAvg = feels.length ? feels.reduce(function (s, x) { return s + x; }, 0) / feels.length : null;
    var chT = avgAgree(G.teams, 2), chD = avgAgree(G.dirs, 1);
    function rrow(label, a, b) {
      return "<tr><td>" + esc(label) + '</td><td class="num">' + (a == null ? "–" : a) + '</td><td class="num">' + (b == null ? "–" : b) + "</td></tr>";
    }
    var rk = shareAgree(G.teams, 0), fi = shareAgree(G.teams, 1);
    var ready = '<table class="rt"><thead><tr><th></th><th class="num">' + esc(T("cTeams")) + '</th><th class="num">' + esc(T("cDir")) + "</th></tr></thead><tbody>" +
      rrow(T("rUsedWork"), usedWork == null ? null : pct(usedWork), null) +
      rrow(T("rFeel"), feelAvg == null ? null : h1(feelAvg), null) +
      rrow(T("rRekey"), rk == null ? null : pct(rk), null) +
      rrow(T("rFind"), fi == null ? null : pct(fi), null) +
      rrow(T("rChange"), chT == null ? null : h1(chT), chD == null ? null : h1(chD)) + "</tbody></table>";

    // Directions to discuss
    var dirs = [];
    function lever(tag, p, d) { dirs.push('<div class="lever"><span class="l-tag">' + esc(tag) + "</span><p>" + esc(p) + '</p><p class="decide"><b>' + esc(T("decide")) + "</b> " + esc(d) + "</p></div>"); }
    var autoItems = cand.filter(function (m) { return m.c === "auto"; });
    if (SV.total[1] > 0) lever(T("dSave"), fmt(T("dSaveP"), { r: hr(SV.total), pp: hr([SV.total[0] / responses.length, SV.total[1] / responses.length]), a: hr(SV.agent), b: hr(SV.assistant) }), T("dSaveD"));
    if (H.auto > 0) lever(T("dQuick"), fmt(T("dQuickP"), { h: h1(H.auto), list: autoItems.slice(0, 3).map(function (m) { return (lang === "fr" ? "« " : "“") + m.x.n + (lang === "fr" ? " »" : "”"); }).join(", ") || "—" }), T("dQuickD"));
    if (H.aug > 0) lever(T("dAug"), fmt(T("dAugP"), { h: h1(H.aug) }), T("dAugD"));
    var confN = allActs.filter(function (x) { return x.c === 0 || x.c === 2; }).length;
    if (confN) lever(T("dData"), fmt(T("dDataP"), { n: confN }), T("dDataD"));
    function topIdx(arr) { var best = -1, bi = -1; arr.forEach(function (v, i) { if (v != null && v > best) { best = v; bi = i; } }); return best > 0 ? bi : -1; }
    var rt = topIdx(reT), rd = topIdx(reD);
    if (rt >= 0 && rd >= 0 && rt !== rd) lever(T("dReinvDiff"), fmt(T("dReinvDiffP"), { a: T("reinvest")[rt], b: T("reinvest")[rd] }), T("dReinvDiffD"));
    else if (rt >= 0 || rd >= 0) lever(T("dReinvSame"), fmt(T("dReinvSameP"), { a: T("reinvest")[rt >= 0 ? rt : rd] }), T("dReinvSameD"));
    var allResp = G.teams.concat(G.dirs);
    var coAll = T("concerns").map(function (_, i) { return i === 6 ? null : shareOf(allResp, "co", i); });
    var ct = topIdx(coAll);
    if (ct >= 0) lever(T("dConc"), fmt(T("dConcP"), { c: T("concerns")[ct], p: Math.round(coAll[ct]) }), T("dConcD"));
    if (chT != null && chD != null && Math.abs(chT - chD) >= 0.8) lever(T("dGap"), fmt(T("dGapP"), { d: h1(chD), t: h1(chT) }), T("dGapD"));
    var tt = topIdx(trT);
    if (tt >= 0) lever(T("dTrain"), fmt(T("dTrainP"), { x: T("train")[tt] }), T("dTrainD"));

    return '<div class="tiles">' +
      '<div class="tile"><div class="v">' + responses.length + '</div><div class="l">' + esc(T("gTiles")[0]) + " · " + esc(fmt(T("gRespSplit"), { t: nt, d: nd })) + "</div></div>" +
      '<div class="tile"><div class="v">' + allActs.length + '</div><div class="l">' + esc(T("gTiles")[1]) + "</div></div>" +
      '<div class="tile"><div class="v">' + h1(H.total) + '</div><div class="l">' + esc(T("gTiles")[2]) + "</div></div>" +
      '<div class="tile"><div class="v accent">' + hr(SV.total) + '</div><div class="l">' + esc(T("gTileS")) + " · " + esc(fmt(T("gPerPerson"), { r: hr([SV.total[0] / responses.length, SV.total[1] / responses.length]) })) + "</div></div></div>" +
      '<div class="card"><h3>' + esc(T("cDirs")) + '</h3><p class="sub">' + esc(T("cDirsSub")) + '</p><div class="levers">' + dirs.join("") + "</div></div>" +
      groupSavings(G, min, responses.length) +
      '<div class="card"><h3>' + esc(T("cTime")) + '</h3><p class="sub">' + esc(fmt(T("cTimeSub"), { min: min })) + "</p>" + catLegend() +
        '<div class="bars">' + timeRows.join("") + "</div></div>" +
      '<div class="card"><h3>' + esc(T("cCand")) + '</h3><p class="sub">' + esc(T("cCandSub")) + "</p>" + alist(cand.slice(0, 10)) + "</div>" +
      '<div class="card"><h3>' + esc(T("cKeep")) + '</h3><p class="sub">' + esc(T("cKeepSub")) + "</p>" + alist(keep.slice(0, 6)) + "</div>" +
      '<div class="card"><h3>' + esc(T("cReinv")) + '</h3><p class="sub">' + esc(T("cShareSub")) + "</p>" + audienceLegend(nt, nd) + pairRows(T("reinvest"), reT, reD, nd > 0) + "</div>" +
      '<div class="card"><h3>' + esc(T("cConc")) + '</h3><p class="sub">' + esc(T("cShareSub")) + "</p>" + audienceLegend(nt, nd) + pairRows(T("concerns"), coT, coD, nd > 0) + "</div>" +
      (nt ? '<div class="card"><h3>' + esc(T("cTrain")) + '</h3><p class="sub">' + esc(T("cTrainSub")) + "</p>" + pairRows(T("train"), trT, [], false) + "</div>" : "") +
      '<div class="card"><h3>' + esc(T("cReady")) + '</h3><div style="overflow-x:auto">' + ready + "</div></div>";
  }

  function groupSavings(G, min, n) {
    var rows = [];
    G.rows.forEach(function (row) { if (row.list.length >= min) rows.push({ name: row.name, list: row.list }); });
    if (G.dirs.length) rows.push({ name: T("cLead"), list: G.dirs });
    var data = rows.map(function (row) {
      var acts = []; row.list.forEach(function (r) { acts = acts.concat(r.acts); });
      return { name: row.name, n: row.list.length, s: savingsOf(acts) };
    });
    var max = 0; data.forEach(function (d) { max = Math.max(max, d.s.hours); });
    var bars = data.map(function (d) {
      var parts = [
        { lo: d.s.agent[0], hi: d.s.agent[1], v: "--c-auto", tip: T("helpAgent") + " · " + hr(d.s.agent, true) },
        { lo: d.s.assistant[0], hi: d.s.assistant[1], v: "--c-aug", tip: T("helpAssist") + " · " + hr(d.s.assistant, true) }
      ];
      return '<div class="bar-row"><div class="name">' + esc(d.name) + "<small>" + esc(fmt(T("gPerPerson"), { r: hr([d.s.total[0] / d.n, d.s.total[1] / d.n]) })) + "</small></div>" +
        '<div class="bar-line">' + saveBar(parts, d.s.hours, max || 1) + '<span class="val">' + esc(hr(d.s.total)) + "</span></div>" +
        '<div class="breakdown"><span>' + esc(T("helpAgent")) + " " + esc(hr(d.s.agent)) + "</span><span>" + esc(T("helpAssist")) + " " + esc(hr(d.s.assistant)) + "</span><span>" + esc(fmt(T("sOf"), { h: h1(d.s.hours) })) + "</span></div></div>";
    }).join("");
    // Biggest savers: activity text only from groups that reach the minimum size.
    var items = [];
    G.eligible.forEach(function (e) { e.r.acts.forEach(function (x) { if (helpType(x) !== "human") items.push({ x: x, g: e.g, v: savedOf(x) }); }); });
    items.sort(function (a, b) { return b.v[1] - a.v[1]; });
    var top = items.slice(0, 8).map(function (m) {
      return '<li><span class="a-n">' + esc(m.x.n) + '</span><span class="a-h">' + esc(fmt(T("sSaves"), { r: hr(m.v, true) })) + "</span>" +
        '<span class="a-m">' + helpChip(m.x) + (m.g ? "<span>" + esc(m.g) + "</span>" : "") + "</span></li>";
    }).join("");
    return '<div class="card"><h3>' + esc(T("cSave")) + '</h3><p class="sub">' + esc(fmt(T("cSaveSub"), { min: min })) + "</p>" + helpLegend() +
      (bars ? '<div class="bars">' + bars + "</div>" : '<p class="muted" style="font-size:0.9rem">' + esc(T("cNone")) + "</p>") +
      '<h4 style="margin-top:1.6rem">' + esc(T("cSaveTop")) + '</h4><p class="sub">' + esc(T("cSaveTopSub")) + "</p>" +
      (top ? '<ul class="alist">' + top + "</ul>" : '<p class="muted" style="font-size:0.9rem">' + esc(T("cNone")) + "</p>") +
      '<p class="method">' + esc(T("sMethod")) + "</p></div>";
  }

  function liveSession() { return LIVE_SRC || SESSION; }

  function renderGroup() {
    var s = liveSession();
    var responses = s ? s.responses : [];
    var isCurrent = !LIVE_SRC && SESSION;
    var note = LIVE_SRC || (SESSION && SESSION.closed) ? T("gClosed") : T("gLive");
    return '<section class="screen" id="report-root">' +
      '<p class="eyebrow"><span class="mark">MR5</span> · ' + esc(T("gEyebrow")) + "</p>" +
      "<h1>" + esc(T("gTitle")) + "</h1>" +
      '<p class="org-line"><strong>' + esc(s ? s.org : "") + '</strong><span class="sep">·</span>' + esc(dateStr(s && s.createdAt)) + "</p>" +
      '<p class="lede no-pdf" style="font-size:0.88rem;margin-top:0.4rem">' + esc(note) + "</p>" +
      (responses.length ? renderGroupBody(responses, (s && s.min) || 5) : '<div class="status-banner">' + esc(T("gEmpty")) + "</div>") +
      (isCurrent && ART ? adminHTML() : "") +
      '<div class="nav-row no-pdf" style="justify-content:flex-start;gap:0.8rem">' +
      '<button class="btn ghost" data-act="to-intro">' + esc(T("btnBackConsole")) + "</button>" +
      (responses.length ? '<button class="btn ghost" data-act="report">' + esc(T("btnReport")) + "</button>" : "") +
      "</div></section>";
  }

  function adminHTML() {
    var html = '<div class="admin-box no-pdf">';

  // ============ render dispatch ============
  function render() {
    var html;
    if (view === "survey") html = renderStep();
    else if (view === "personal") html = renderPersonal();
    else if (view === "group") html = renderGroup();
    else if (view === "facilitator") html = renderFacilitator();
    else html = STANDALONE ? renderSurveyIntro() : renderConsole();
    $("app").innerHTML = html;

    updateNext();

  function go(v) { view = v; render(); window.scrollTo(0, 0); }

  // ============ persistence (the artifact republishes itself) ============
  function buildDocument(store) {
    var json = JSON.stringify(store).replace(/</g, "\\u003c");
    return INITIAL_HTML.replace(/<html[^>]*>/, "<html>").replace(
      /(<script type="application\/json" id="aia-data">)[\s\S]*?(<\/script>)/,
      function (m, p1, p2) { return p1 + json + p2; });
  }
  function publishStore(store) {
    if (!ART) return Promise.reject({ code: "unavailable" });
    return ART.publish(buildDocument(store));
  }
  function publishSession(sess) { return publishStore({ v: 1, session: sess, archive: ARCHIVE }); }
  function copyJSON(o) { return JSON.parse(JSON.stringify(o)); }

  function submitToSession(p) {
    submitHTML = '<div class="status-banner">' + esc(T("submitPending")) + "</div>";
    lsSet("aia-pending", p);
    ssSet("aia-personal", p);
    if (!ART || !SESSION || SESSION.closed) { fallback(); return; }
    var ns = copyJSON(SESSION);
    if (!ns.responses.some(function (r) { return r.id === p.id; })) ns.responses.push(p);
    publishSession(ns).then(function () {
      lsDel("aia-pending");
      // every view reloads to the new version; these results come back from sessionStorage
    }, function (e) {
      var code = e && e.code;
      if (code === "not_granted" || code === "not_writer") fallback();
      else if (code === "conflict") { /* the reload retries the pending answer */ }
      else { lsDel("aia-pending"); submitHTML = '<div class="status-banner err">' + esc(T("submitErr")) + '<div class="code-box">' + esc(encodeCode(p)) + "</div></div>"; refreshStatus(); }
    });
    function fallback() {
      lsDel("aia-pending");
      submitHTML = '<div class="status-banner err">' + T("submitFallback") + '<div class="code-box">' + esc(encodeCode(p)) + "</div></div>";
      refreshStatus();
    }
  }
  function refreshStatus() { var s = $("submit-status"); if (s) s.innerHTML = submitHTML; }

  function retryPending() {
    if (!ART || !SESSION || SESSION.closed) return;
    var p = lsGet("aia-pending");
    if (!p || !p.id) return;
    if (SESSION.responses.some(function (r) { return r.id === p.id; })) { lsDel("aia-pending"); return; }
    var ns = copyJSON(SESSION); ns.responses.push(p);
    publishSession(ns).then(function () { lsDel("aia-pending"); }, function () {});
  }

  // ============ events ============
  function onClick(e) {
    var t = e.target.closest("[data-act]");
    if (!t) return;
    var act = t.getAttribute("data-act");
    var steps = STEPS[FORM];
    switch (act) {
      case "start":
        state = freshState(); saveDraft(); go("survey"); break;
      case "resume":
        state = lsGet(draftKey()); if (!state.id) state.id = rid(); go("survey"); break;
      case "back":
        if (state.step === 0) { go("intro"); break; }
        state.step -= 1; saveDraft(); go("survey"); break;
      case "next":
        if (!stepValid(steps[state.step])) return;
        if (state.step < steps.length - 1) { state.step += 1; saveDraft(); go("survey"); break; }
        lastPayload = buildPayload();
        if (mode === "standalone") { submitHTML = standaloneCodeHTML(lastPayload); state.done = true; saveDraft(); go("personal"); }
        else if (mode === "respond") { submitToSession(lastPayload); go("personal"); }
        else { submitHTML = ""; go("personal"); }
        break;
      case "add":
        state.a.acts.push({}); saveDraft(); render();
        var cards = document.querySelectorAll(".act"), lastCard = cards[cards.length - 1];
        if (lastCard) { lastCard.scrollIntoView({ behavior: "smooth", block: "start" }); var inp = lastCard.querySelector("input[type=text]"); if (inp) inp.focus({ preventScroll: true }); }
        break;
      case "rm":
        state.a.acts.splice(+t.getAttribute("data-i"), 1); saveDraft(); render(); break;
      case "edit":
        state.done = false; state.step = steps.length - 1; saveDraft(); go("survey"); break;
      case "copy-code":
        copyText($("code").textContent, $("copy-msg")); break;
      case "to-intro":
        ssDel("aia-view"); ssDel("aia-personal"); LIVE_SRC = null; closeArmed = false; codeMsg = ""; mode = STANDALONE ? "standalone" : "solo"; go("intro"); break;
      case "report":
        downloadReport(t); break;

      // console
      case "answer":
        FORM = t.getAttribute("data-f") === "d" ? "d" : "t";
        mode = t.getAttribute("data-solo") || !(SESSION && !SESSION.closed) ? "solo" : "respond";
        state = freshState(); go("survey"); break;
      case "live":
        LIVE_SRC = null; ssSet("aia-view", "group"); go("group"); break;
      case "archive":
        LIVE_SRC = ARCHIVE[+t.getAttribute("data-i")]; go("group"); break;
      case "create":
        createSession(); break;
      case "new-session":
        t.disabled = true;
        publishStore({ v: 1, session: null, archive: ARCHIVE.concat([SESSION]) }).catch(function () {
          t.disabled = false; var m = $("admin-msg"); if (m) m.textContent = T("saveErr");
        });
        break;
      case "copy-link":
        copyText($("link-" + t.getAttribute("data-k")).textContent, $("msg-" + t.getAttribute("data-k"))); break;
      case "present":
        openPresent($("link-" + t.getAttribute("data-k")).textContent); break;
      case "save-qr":
        var svg = qrSvg($("link-" + t.getAttribute("data-k")).textContent);
        if (svg) saveFile("qr-" + (t.getAttribute("data-k") === "t" ? "team" : "leadership") + ".svg", svg, "image/svg+xml");
        break;
      case "add-codes":
        addCodes(); break;
      case "close":
        if (!closeArmed) { closeArmed = true; t.textContent = T("btnCloseConfirm"); break; }
        var nc = copyJSON(SESSION); nc.closed = true;
        publishSession(nc).catch(function () { $("admin-msg").textContent = T("saveErr"); });
        break;
      case "reopen":
        var nr = copyJSON(SESSION); nr.closed = false;
        publishSession(nr).catch(function () { $("admin-msg").textContent = T("saveErr"); });
        break;
      case "csv-r":
        saveFile("respondents.csv", "﻿" + respondentsCsv(currentResponses()), "text/csv;charset=utf-8"); break;
      case "csv-a":
        saveFile("activities.csv", "﻿" + activitiesCsv(currentResponses()), "text/csv;charset=utf-8"); break;

      // public facilitator view
      case "f-read":
        var res = parseCodes($("f-codes").value, compiled);
        compiled = compiled.concat(res.valid);
        var nt = compiled.filter(function (r) { return r.f === "t"; }).length;
        var msgText = fmt(T("fFound"), { n: compiled.length, t: nt, d: compiled.length - nt, bad: res.bad, dup: res.dup });
        var codes = $("f-codes").value;
        render();
        $("f-codes").value = codes; $("f-msg").textContent = msgText;
        break;
    }
  }

  function currentResponses() { return view === "facilitator" ? compiled : (liveSession() ? liveSession().responses : []); }

  function onChange(e) {
    var el = e.target;
    if (view === "facilitator") { if (el.closest("#f-links")) updateFacilitatorLinks(); return; }
    if (view === "intro") { syncCreate(); return; }
    if (view !== "survey") return;
    var a = state.a, name = el.name || "";
    if (el.hasAttribute("data-act-i")) {
      a.acts[+el.getAttribute("data-act-i")].n = el.value;
    } else if (el.hasAttribute("data-k")) {
      a[el.getAttribute("data-k")] = el.value;
    } else if (/^a\d+_\w$/.test(name)) {
      var m = name.match(/^a(\d+)_(\w)$/);
      a.acts[+m[1]][m[2]] = +el.value;
    } else if (/_\d+$/.test(name)) {
      var p = name.match(/^(\w+)_(\d+)$/);
      if (!Array.isArray(a[p[1]])) a[p[1]] = new Array(findQ(p[1]).rows.length).fill(null);
      a[p[1]][+p[2]] = +el.value;
    } else if (el.type === "checkbox") {
      var q = findQ(name);
      var arr = Array.isArray(a[name]) ? a[name].slice() : [];
      var v = +el.value, at = arr.indexOf(v);
      if (el.checked && at < 0) arr.push(v);
      if (!el.checked && at >= 0) arr.splice(at, 1);
      arr.sort(function (x, y) { return x - y; });
      a[name] = arr;
      Array.prototype.forEach.call(document.querySelectorAll('input[name="' + name + '"]'), function (b) { b.disabled = !b.checked && arr.length >= q.max; });
      if (q.other) {
        var oi = document.querySelector('[data-k="' + name + 'o"]');
        var on = arr.indexOf(T(q.o).length) >= 0;
        if (oi) { oi.hidden = !on; if (on && el.checked && v === T(q.o).length) oi.focus(); }
        if (!on) delete a[name + "o"];
      }
    } else if (el.type === "radio") {
      var qq = findQ(name);
      a[name] = qq && qq.type === "scale" ? +el.value + 1 : +el.value;
    }
    saveDraft(); updateNext();
  }
  function findQ(k) {
    var found = null;
    STEPS[FORM].forEach(function (s) { (s.qs || []).forEach(function (q) { if (q.k === k) found = q; }); });
    return found;
  }

  function syncCreate() {

  }

  function createSession() {
    var org = $("n-org").value.trim();
    if (!org || !ART) return;
    var sess = {
      active: true, closed: false, org: org,
      roles: $("n-roles").value.split("\n").map(function (s) { return s.trim(); }).filter(Boolean),
      min: Math.max(2, parseInt($("n-min").value, 10) || 5),
      email: $("n-to").value.trim() || DEFAULT_TO,
      lang: $("n-lang").value === "fr" ? "fr" : "en",
      createdAt: Date.now(), responses: []
    };
    $("create-msg").textContent = T("creating");
    publishSession(sess).catch(function () { $("create-msg").textContent = T("saveErr"); });
  }

  function addCodes() {
    var res = parseCodes($("code-input").value, SESSION.responses);
    var msg = $("code-msg");
    if (!res.valid.length) { msg.textContent = fmt(T("addCodeRes"), { n: 0, bad: res.bad, dup: res.dup }); return; }
    var ns = copyJSON(SESSION);
    res.valid.forEach(function (r) { ns.responses.push(r); });
    msg.textContent = "…";
    ssSet("aia-code-msg", fmt(T("addCodeRes"), { n: res.valid.length, bad: res.bad, dup: res.dup }));
    publishSession(ns).catch(function () { ssDel("aia-code-msg"); msg.textContent = T("saveErr"); });
  }

  function copyText(text, msgEl) {
    var ok = function () { if (msgEl) msgEl.textContent = T("copied"); };
    var fail = function () { if (msgEl) msgEl.textContent = T("copyFail"); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fail);
    else fail();
  }

  function saveFile(name, data, type) {
    if (DL) { DL.save({ filename: name, data: data }).catch(function () {}); return; }
    var blob = new Blob([data], { type: type });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  function openPresent(url) {
    var svg = qrSvg(url);
    if (!svg) return;
    var old = $("present-overlay"); if (old) old.parentNode.removeChild(old);
    var org = SESSION ? SESSION.org : P.org;
    var ov = document.createElement("div");
    ov.className = "present-overlay"; ov.id = "present-overlay";
    ov.innerHTML = '<div class="p-exit">Esc ✕</div>' +
      '<div class="p-org">' + esc(org || "") + "</div>" +
      '<div class="p-qr">' + svg + "</div>" +
      '<div class="p-scan">' + esc(T("scan")) + "</div>" +
      '<div class="p-url">' + esc(url) + "</div>";
    document.body.appendChild(ov);
    ssSet("aia-present", url);
    function close() {
      if (ov.parentNode) ov.parentNode.removeChild(ov);
      ssDel("aia-present");
      document.removeEventListener("keydown", onKey);
    }
    function onKey(ev) { if (ev.key === "Escape") close(); }
    ov.addEventListener("click", close);
    document.addEventListener("keydown", onKey);
  }

  // ============ CSV ============
  function csvCell(v) {
    if (v == null) return "";
    var s = Array.isArray(v) ? v.join("; ") : String(v);
    return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function pick(optKey, v) {
    var opts = T(optKey);
    if (Array.isArray(v)) return v.map(function (i) { return i < opts.length ? opts[i] : T("other"); });
    return v == null ? "" : opts[v];
  }
  function respondentsCsv(list) {
    var cols = ["id", "form", "date", "lang", "org", "role_group", "name_title", "scope", "top_activities", "exclusions",
      "coverage", "hand_over", "keep", "agree_rekey", "agree_find", "agree_teams_welcome_change", "agree_change_supported",
      "reinvest", "reinvest_other", "ai_used", "ai_feeling_1_5", "concerns", "concerns_other", "concerns_text",
      "training", "training_other", "ai_tools", "ai_tools_which", "data_indicators", "obligations", "written_rules",
      "who_decides", "champion", "n_activities"];
    var lines = [cols.join(",")];
    list.forEach(function (r) {
      var ag = r.ag || [], t = r.f === "t";
      var agv = function (i) { return ag[i] == null ? "" : T("agree")[ag[i]]; };
      lines.push([r.id, t ? "team" : "leadership", r.d, r.l, r.org, t ? r.role : "", r.nm, r.sc, r.top, r.ex,
        pick("cover", r.cov), r.give, r.keep,
        t ? agv(0) : "", t ? agv(1) : "", t ? "" : agv(0), t ? agv(2) : agv(1),
        pick("reinvest", r.re), r.reo, pick("used", r.ai), r.feel, pick("concerns", r.co), r.coo, r.cq,
        pick("train", r.tr), r.tro, pick("tools", r.tl), r.tlw, r.dt, r.ob, pick("rules", r.ru), r.who, r.ch, r.acts.length].map(csvCell).join(","));
    });
    return lines.join("\n");
  }
  function activitiesCsv(list) {
    var cols = ["respondent_id", "form", "role_group", "activity_no", "activity", "hours_per_week_bracket", "hours_per_week_estimate",
      "same_way", "value", "error_consequence", "confidential", "wants_to_lighten", "proposed_category", "ai_help", "hours_saved_low", "hours_saved_high", "validated_category"];
    var lines = [cols.join(",")];
    list.forEach(function (r) {
      r.acts.forEach(function (x, i) {
        lines.push([r.id, r.f === "t" ? "team" : "leadership", r.f === "d" ? T("cLead") : (r.role || T("prefNot")), i + 1, x.n,
          pick("hours", x.h), HOURS_MID[x.h], pick("same", x.s), pick("value", x.v), pick("err", x.e), pick("conf", x.c),
          pick("lighten", x.w), T(CAT_LABEL[classify(x)]), T(HELP_LABEL[helpType(x)]), savedOf(x)[0], savedOf(x)[1], ""].map(csvCell).join(","));
      });
    });
    return lines.join("\n");
  }

  // ============ PDF report (same approach as the Four Quotients page) ============
  var PDF_LIBS = [
    "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
  ];
  var pdfLibsP = null;
  function loadScript(src) {
    return new Promise(function (res, rej) {
      var s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });
  }
  function loadPdfLibs() {
    if (!pdfLibsP) {
      pdfLibsP = loadScript(PDF_LIBS[0]).then(function () { return loadScript(PDF_LIBS[1]); });
      pdfLibsP.catch(function () { pdfLibsP = null; });
    }
    return pdfLibsP;
  }
  function slug(s) {
    return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "")
      .replace(/[^A-Za-z0-9]+/g, "-").replace(/^-+|-+$/g, "").toLowerCase() || "report";
  }
  function buildPdf() {
    var el = document.documentElement, prev = el.getAttribute("data-theme");
    el.setAttribute("data-theme", "light"); // chart colors are CSS variables, so the capture is light
    var restore = function () { if (prev === null) el.removeAttribute("data-theme"); else el.setAttribute("data-theme", prev); };
    return loadPdfLibs().then(function () {
      var root = $("report-root"), cuts = [], scale = 2;
      return window.html2canvas(root, {
        scale: scale, backgroundColor: "#ffffff", windowWidth: 1000, logging: false,
        onclone: function (doc) {
          var st = doc.createElement("style");
          st.textContent = "*{animation:none!important;transition:none!important}.no-pdf{display:none!important}";
          doc.head.appendChild(st);
          var wrap = doc.querySelector(".wrap"); if (wrap) wrap.style.maxWidth = "900px";
          var r = doc.getElementById("report-root"), top = r.getBoundingClientRect().top;
          Array.prototype.forEach.call(r.querySelectorAll(".card, .tiles, .lever, .bar-row, .alist li"), function (c) {
            cuts.push((c.getBoundingClientRect().top - top) * scale);
          });
        }
      }).then(function (canvas) {
        restore();
        var pdf = new window.jspdf.jsPDF({ unit: "pt", format: "letter", orientation: "portrait" });
        var pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight();
        var margin = 40, footerH = 20, cw = pw - margin * 2, k = canvas.width / cw;
        var pageH = Math.floor((ph - margin * 2 - footerH) * k);
        var slices = [], start = 0, total = canvas.height;
        while (total - start > pageH) {
          var limit = start + pageH, best = -1;
          cuts.forEach(function (c) { if (c > start + pageH * 0.3 && c <= limit && c > best) best = c; });
          var end = best > 0 ? Math.round(best) : limit;
          slices.push([start, end]); start = end;
        }
        if (total - start > 2) slices.push([start, total]);
        var org = view === "facilitator" ? P.org : (cfg().org || (liveSession() && liveSession().org) || "");
        slices.forEach(function (sl, i) {
          var hgt = sl[1] - sl[0], c = document.createElement("canvas");
          c.width = canvas.width; c.height = hgt;
          var cx = c.getContext("2d");
          cx.fillStyle = "#ffffff"; cx.fillRect(0, 0, c.width, hgt);
          cx.drawImage(canvas, 0, sl[0], canvas.width, hgt, 0, 0, canvas.width, hgt);
          if (i > 0) pdf.addPage();
          pdf.addImage(c.toDataURL("image/jpeg", 0.92), "JPEG", margin, margin, cw, hgt / k);
          pdf.setFontSize(8); pdf.setTextColor(138, 130, 122);
          pdf.text("MR5 InnovAction · AI Activity Diagnostic · " + org, margin, ph - margin / 2 - 4);
          pdf.text((i + 1) + " / " + slices.length, pw - margin, ph - margin / 2 - 4, { align: "right" });
        });
        pdf.setProperties({ title: org + " — AI Activity Diagnostic", author: "MR5 InnovAction" });
        var kind = view === "personal" ? "my-results" : "group-results";
        return { pdf: pdf, filename: "ai-activities-" + kind + "-" + slug(org) + ".pdf" };
      });
    }).catch(function (e) { restore(); throw e; });
  }
  function downloadReport(btn) {
    if (btn.disabled) return;
    btn.disabled = true; btn.textContent = T("pdfPreparing");
    var reset = function () { btn.disabled = false; btn.textContent = T("btnReport"); };
    var done = function () { btn.disabled = false; btn.textContent = T("reportSaved"); setTimeout(function () { btn.textContent = T("btnReport"); }, 2000); };
    buildPdf().then(function (res) {
      if (!DL) { res.pdf.save(res.filename); done(); return; }
      return DL.save({ filename: res.filename, data: res.pdf.output("arraybuffer") }).then(done, reset);
    }).catch(function () { reset(); try { window.print(); } catch (err) {} });
  }

  // ============ tooltip ============
  var tip = $("tooltip");
  document.addEventListener("mouseover", function (e) {
    var el = e.target.closest && e.target.closest("[data-tip]");
    if (!el) { tip.classList.remove("show"); return; }
    tip.textContent = el.getAttribute("data-tip"); tip.classList.add("show");
  });
  document.addEventListener("mousemove", function (e) {
    if (!tip.classList.contains("show")) return;
    var x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
    tip.style.left = x + "px"; tip.style.top = (e.clientY + 14) + "px";
  });

  // ============ language ============
  function setLang(l) {
    lang = l;
    document.documentElement.lang = l;
    $("lang-en").classList.toggle("active", l === "en"); $("lang-en").setAttribute("aria-pressed", l === "en");
    $("lang-fr").classList.toggle("active", l === "fr"); $("lang-fr").setAttribute("aria-pressed", l === "fr");
    var keepCodes = $("f-codes") ? $("f-codes").value : null;
    render();
    if (keepCodes != null && $("f-codes")) $("f-codes").value = keepCodes;
  }
  $("lang-en").addEventListener("click", function () { if (lang !== "en") setLang("en"); });
  $("lang-fr").addEventListener("click", function () { if (lang !== "fr") setLang("fr"); });

  document.addEventListener("click", onClick);
  document.addEventListener("change", onChange);
  document.addEventListener("input", function (e) { if (e.target.matches("input[type=text], textarea")) onChange(e); });

  // ============ start ============
  if (STANDALONE && P.view === "facilitator") view = "facilitator";
  if (!STANDALONE) {
    // Return to where the facilitator or respondent was before the publish-triggered reload.
    var pv = ssGet("aia-personal");
    if (pv && SESSION && SESSION.responses.some(function (r) { return r.id === pv.id; })) {
      lastPayload = pv; FORM = pv.f; mode = "respond"; submitHTML = '<div class="status-banner">' + T("submitOk") + "</div>"; view = "personal";
    } else if (ssGet("aia-view") === "group" && SESSION) {
      view = "group";
    }
  } else if (view !== "facilitator") {
    var dr = lsGet(draftKey());
    if (dr && dr.done && dr.a) { state = dr; lastPayload = buildPayload(); submitHTML = standaloneCodeHTML(lastPayload); view = "personal"; }
  }
  codeMsg = ssGet("aia-code-msg") || "";
  ssDel("aia-code-msg");
  setLang(lang);
  var pres = ssGet("aia-present");
  if (pres && SESSION && !SESSION.closed) openPresent(pres);

  // Resolve the artifact capabilities (they arrive after the first run; null when absent).
  if (!STANDALONE && window.claude && typeof window.claude.use === "function") {
    window.claude.use("artifact").then(function (ns) {
      ART = ns || null;
      if (view === "intro" || view === "group") render();
      retryPending();
    }, function () { ART = null; });
    window.claude.use("downloads").then(function (ns) { DL = ns || null; }, function () { DL = null; });
  } else {
    ART = null; DL = null;
  }
})();
</script>
