<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Activity Diagnostic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=Instrument+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=swap">
<style>
  :root {
    --bg: #F6F3EF; --surface: #FDFBF8; --surface-2: #EFEAE3;
    --ink: #26221E; --ink-2: #5C554D; --ink-3: #8A827A;
    --line: #DDD6CC; --line-strong: #C4BBAE;
    --accent: #B4432A; --accent-ink: #FFFFFF; --accent-soft: rgba(180, 67, 42, 0.10);
    --track: #E7E1D8;
    --shadow: 0 1px 2px rgba(38, 34, 30, 0.05), 0 8px 28px rgba(38, 34, 30, 0.07);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #191817; --surface: #211F1E; --surface-2: #2A2725;
      --ink: #ECE7E0; --ink-2: #B3ACA3; --ink-3: #7D766D;
      --line: #363330; --line-strong: #4A4540;
      --accent: #E0664A; --accent-ink: #1B1210; --accent-soft: rgba(224, 102, 74, 0.13);
      --track: #2E2B29;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 28px rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #191817; --surface: #211F1E; --surface-2: #2A2725;
    --ink: #ECE7E0; --ink-2: #B3ACA3; --ink-3: #7D766D;
    --line: #363330; --line-strong: #4A4540;
    --accent: #E0664A; --accent-ink: #1B1210; --accent-soft: rgba(224, 102, 74, 0.13);
    --track: #2E2B29;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 28px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 2.5rem 1rem 5rem; position: relative; }

  .lang-switch {
    position: absolute; top: 2.3rem; right: 1rem;
    display: flex; border: 1px solid var(--line-strong); border-radius: 999px;
    overflow: hidden; background: var(--surface);
  }
  .lang-switch button {
    font: inherit; font-size: 0.74rem; font-weight: 600; letter-spacing: 0.06em;
    padding: 0.32rem 0.75rem; border: none; background: transparent; color: var(--ink-3); cursor: pointer;
  }
  .lang-switch button.active { background: var(--ink); color: var(--bg); cursor: default; }
  .lang-switch button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  .eyebrow {
    font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-3); font-weight: 600; margin: 0 0 0.75rem; padding-right: 7rem;
  }
  .eyebrow .mark { color: var(--accent); }
  h1, h2, h3 { font-family: "Fraunces", Georgia, serif; text-wrap: balance; margin: 0; }
  h1 { font-size: clamp(1.9rem, 5vw, 2.7rem); font-weight: 600; line-height: 1.12; letter-spacing: -0.01em; }
  h2 { font-size: 1.4rem; font-weight: 600; }
  h3 { font-size: 1.05rem; font-weight: 600; }
  p { margin: 0; }
  .lede { color: var(--ink-2); font-size: 1.04rem; max-width: 60ch; margin-top: 1rem; }
  ul.points { margin: 1.4rem 0 0; padding-left: 1.2rem; color: var(--ink-2); max-width: 60ch; }
  ul.points li { margin-bottom: 0.35rem; }

  .btn {
    display: inline-flex; align-items: center; gap: 0.5em;
    font: inherit; font-weight: 600; font-size: 0.95rem; padding: 0.7rem 1.5rem;
    border-radius: 6px; border: 1px solid transparent; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); transition: filter 120ms ease;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn[disabled] { opacity: 0.45; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--ink-2); border-color: var(--line-strong); }
  .btn.ghost:hover { color: var(--ink); filter: none; border-color: var(--ink-3); }
  .btn.small { font-size: 0.84rem; padding: 0.5rem 1rem; }
  .linklike { background: none; border: none; font: inherit; font-size: 0.86rem; color: var(--ink-3); text-decoration: underline; cursor: pointer; padding: 0; }
  .linklike:hover { color: var(--ink); }

  .progress { margin: 0 0 2rem; }
  .progress-steps { display: flex; gap: 0.4rem; margin-bottom: 0.5rem; }
  .progress-steps .seg { flex: 1; height: 4px; border-radius: 2px; background: var(--track); }
  .progress-steps .seg.done { background: var(--accent); }
  .progress-note {
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.72rem; color: var(--ink-3);
    display: flex; justify-content: space-between; gap: 1rem;
  }

  .s-head { border-left: 3px solid var(--accent); padding-left: 1rem; margin-bottom: 1.4rem; }
  .s-head p { color: var(--ink-2); font-size: 0.95rem; margin-top: 0.4rem; max-width: 60ch; }

  .q { padding: 1.2rem 0; border-bottom: 1px solid var(--line); }
  .q:last-child { border-bottom: none; }
  .q .stmt { font-weight: 500; margin-bottom: 0.7rem; max-width: 62ch; }
  .q .stmt .opt { font-weight: 400; color: var(--ink-3); font-size: 0.88rem; }
  .q .help { font-size: 0.84rem; color: var(--ink-3); margin: -0.4rem 0 0.7rem; max-width: 62ch; }

  .choices { display: flex; flex-wrap: wrap; gap: 0.45rem; }
  .choices.stack { flex-direction: column; align-items: stretch; }
  .choices input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .choices label {
    display: block; padding: 0.5rem 0.85rem; border: 1px solid var(--line-strong); border-radius: 6px;
    background: var(--surface); color: var(--ink-2); font-size: 0.92rem; cursor: pointer; user-select: none;
    transition: border-color 100ms, background 100ms, color 100ms;
  }
  .choices label:hover { border-color: var(--ink-3); color: var(--ink); }
  .choices input:checked + label { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .choices input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
  .choices input:disabled + label { opacity: 0.4; cursor: not-allowed; }
  .choices.scale label { min-width: 2.6rem; text-align: center; font-family: "IBM Plex Mono", ui-monospace, monospace; }
  .scale-caps { display: flex; justify-content: space-between; font-size: 0.76rem; color: var(--ink-3); max-width: 16.5rem; margin-top: 0.3rem; }

  input[type="text"], textarea, select {
    width: 100%; font: inherit; font-size: 0.95rem; padding: 0.55rem 0.75rem;
    border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: var(--ink);
  }
  textarea { min-height: 4.6em; resize: vertical; }
  input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  input::placeholder, textarea::placeholder { color: var(--ink-3); opacity: 1; }
  .other-input { margin-top: 0.5rem; }

  .act {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 1.1rem 1.2rem 0.4rem; margin-top: 1.2rem; box-shadow: var(--shadow);
  }
  .act-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
  .act-tag {
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.72rem; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--accent); font-weight: 600;
  }
  .act .q { padding: 0.9rem 0; }
  .act .q .stmt { font-size: 0.95rem; margin-bottom: 0.55rem; }
  .act .choices label { font-size: 0.86rem; padding: 0.42rem 0.7rem; }
  .add-row { margin-top: 1.2rem; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
  .add-row .hint { font-size: 0.84rem; color: var(--ink-3); }

  .agree-row { padding: 0.9rem 0; border-bottom: 1px dashed var(--line); }
  .agree-row:last-child { border-bottom: none; }
  .agree-row .stmt { margin-bottom: 0.55rem; }
  .agree-row .choices label { font-size: 0.82rem; padding: 0.4rem 0.6rem; }

  .nav-row { display: flex; justify-content: space-between; align-items: center; margin-top: 2rem; gap: 1rem; flex-wrap: wrap; }
  .nav-row .hint { font-size: 0.82rem; color: var(--ink-3); flex: 1; text-align: center; min-width: 10rem; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 1.4rem; margin-top: 1.4rem; box-shadow: var(--shadow); }
  .card > h3 { margin-bottom: 0.35rem; }
  .card .sub { font-size: 0.86rem; color: var(--ink-3); margin-bottom: 1rem; }
  .notice { margin-top: 1.4rem; padding: 0.9rem 1.2rem; border-radius: 8px; background: var(--accent-soft); color: var(--ink-2); font-size: 0.92rem; max-width: 62ch; }
  .notice strong { color: var(--ink); }
  .code-box {
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.72rem; padding: 0.6rem;
    border: 1px solid var(--line-strong); border-radius: 6px; background: var(--bg); color: var(--ink-2);
    word-break: break-all; margin-top: 0.6rem; user-select: all; max-height: 8em; overflow-y: auto;
  }
  .btn-row { display: flex; gap: 0.7rem; flex-wrap: wrap; margin-top: 1rem; }
  .msg { font-size: 0.84rem; color: var(--ink-3); margin-top: 0.5rem; min-height: 1.2em; }

  .tbl-scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
  th, td { text-align: left; padding: 0.45rem 0.6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 600; color: var(--ink-2); font-size: 0.78rem; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; font-family: "IBM Plex Mono", ui-monospace, monospace; }
  .muted { color: var(--ink-3); }
  .field { margin-bottom: 0.9rem; }
  .field label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--ink-2); margin-bottom: 0.3rem; }

  .foot { margin-top: 3rem; padding-top: 1.2rem; border-top: 1px solid var(--line); font-size: 0.8rem; color: var(--ink-3); max-width: 62ch; }
  .screen { animation: fade 240ms ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .screen { animation: none; } }
  @media (max-width: 520px) { .eyebrow { padding-right: 6rem; } .nav-row .hint { order: 3; flex-basis: 100%; } }
  @media print { .btn, .nav-row, .lang-switch, .linklike { display: none !important; } body { background: #fff; color: #111; } }
</style>
</head>

<div class="wrap">

    <button id="lang-en" class="active" aria-pressed="true">EN</button>
    <button id="lang-fr" aria-pressed="false">FR</button>
  </div>
  <main id="app"></main>
  <p class="foot" id="foot"></p>
</div>

  // ---------- helpers ----------
  function T(k) { return I18N[lang][k]; }
  function fmt(s, o) {
    return String(s).replace(/\{(\w+)\}/g, function (m, k) { return o && o[k] != null ? o[k] : m; });
  }
  function orgName() { return ORG || T("ourOrg"); }
  function tx(k, o) { return fmt(T(k), Object.assign({ org: esc(orgName()), min: MIN_GROUP }, o || {})); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function $(id) { return document.getElementById(id); }
  function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function roles() { return ROLES_PARAM.length ? ROLES_PARAM : DEFAULT_ROLES[lang]; }
  function filled(v) { return v != null && v !== "" && !(Array.isArray(v) && !v.length); }
  function rid() {
    var a = new Uint8Array(6);
    (window.crypto || {}).getRandomValues ? crypto.getRandomValues(a) : a.forEach(function (_, i) { a[i] = Math.random() * 256; });
    return Array.prototype.map.call(a, function (b) { return b.toString(16).padStart(2, "0"); }).join("");
  }
  function b64urlEncode(str) {
    return btoa(unescape(encodeURIComponent(str))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function b64urlDecode(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    return decodeURIComponent(escape(atob(s)));
  }

  // ---------- form definition ----------

  // ---------- state ----------
  var state = null;      // { a: answers, step, done }
  function freshState() {
    var lo = STEPS[FORM].filter(function (s) { return s.acts; })[0].acts.lo;
    var acts = [];
    for (var i = 0; i < lo; i++) acts.push({});
    return { step: -1, done: false, a: { acts: acts } };
  }
  function save() { lsSet(STORE_KEY, state); }

  // ---------- rendering: survey ----------
  function renderIntro() {
    var draft = lsGet(STORE_KEY);
    var hasDraft = draft && draft.step >= 0;
    var pts = T(FORM === "t" ? "pointsT" : "pointsD").map(function (p) { return "<li>" + fmt(p, { min: MIN_GROUP }) + "</li>"; }).join("");
    $("app").innerHTML =
      '<section class="screen">' +
      '<p class="eyebrow"><span class="mark">MR5</span> · ' + esc(T(FORM === "t" ? "eyebrowT" : "eyebrowD")) + (ORG ? " · " + esc(ORG) : "") + "</p>" +
      "<h1>" + esc(T(FORM === "t" ? "titleT" : "titleD")) + "</h1>" +
      '<p class="lede">' + tx(FORM === "t" ? "ledeT" : "ledeD") + "</p>" +
      '<ul class="points">' + pts + "</ul>" +
      '<div class="btn-row" style="margin-top:1.8rem">' +
      (hasDraft
        ? '<button class="btn" data-act="resume">' + esc(T("resume")) + '</button><button class="btn ghost" data-act="restart">' + esc(T("restart")) + "</button>"
        : '<button class="btn" data-act="start">' + esc(T("start")) + "</button>") +
      "</div></section>";
  }

  function choiceGroup(name, opts, val, multi, extra) {
    extra = extra || {};
    var cls = "choices" + (extra.stack ? " stack" : "") + (extra.scale ? " scale" : "");
    var atMax = multi && extra.max && Array.isArray(val) && val.length >= extra.max;
    return '<div class="' + cls + '" role="' + (multi ? "group" : "radiogroup") + '">' + opts.map(function (o, i) {
      var id = name + "-" + i;
      var on = multi ? (Array.isArray(val) && val.indexOf(i) >= 0) : val === i;
      return '<input type="' + (multi ? "checkbox" : "radio") + '" id="' + id + '" name="' + name + '" value="' + i + '"' +
        (on ? " checked" : "") + (atMax && !on ? " disabled" : "") + '><label for="' + id + '">' + esc(o) + "</label>";
    }).join("") + "</div>";
  }

  function qBlock(q, a) {
    var head = '<p class="stmt" id="lbl-' + q.k + '">' + tx(q.q) + (q.req ? " *" : ' <span class="opt">' + esc(T("optional")) + "</span>") + "</p>" +
      (q.help ? '<p class="help">' + tx(q.help) + "</p>" : "");
    var v = a[q.k], body = "";
    switch (q.type) {
      case "role":
        body = choiceGroup(q.k, roles().concat([T("prefNot")]), v, false, { stack: true });
        break;
      case "one":
        body = choiceGroup(q.k, T(q.o), v, false, { stack: q.stack });
        break;
      case "many":
        body = '<p class="help">' + esc(fmt(T("upTo"), { n: q.max })) + "</p>" +
          choiceGroup(q.k, T(q.o).concat(q.other ? [T("other")] : []), v, true, { stack: true, max: q.max });
        if (q.other) {
          var otherOn = Array.isArray(v) && v.indexOf(T(q.o).length) >= 0;
          body += '<input type="text" class="other-input" data-k="' + q.k + 'o" maxlength="200" placeholder="' + esc(T("otherPh")) + '" value="' + esc(a[q.k + "o"] || "") + '"' + (otherOn ? "" : " hidden") + ">";
        }
        break;
      case "scale":
        body = choiceGroup(q.k, ["1", "2", "3", "4", "5"], v == null ? null : v - 1, false, { scale: true }) +
          '<div class="scale-caps"><span>' + esc(T("feelLo")) + "</span><span>" + esc(T("feelHi")) + "</span></div>";
        break;
      case "agree":
        body = q.rows.map(function (r, i) {
          var vv = Array.isArray(v) ? v[i] : null;
          return '<div class="agree-row"><p class="stmt">' + tx(r) + "</p>" + choiceGroup(q.k + "_" + i, T("agree"), vv, false) + "</div>";
        }).join("");
        break;
      case "short":
        body = '<input type="text" data-k="' + q.k + '" maxlength="200" aria-labelledby="lbl-' + q.k + '" value="' + esc(v || "") + '">';
        break;
      case "long":
        body = '<textarea data-k="' + q.k + '" maxlength="1500" aria-labelledby="lbl-' + q.k + '">' + esc(v || "") + "</textarea>";
        break;
    }
    return '<div class="q">' + head + body + "</div>";
  }

  function actCard(act, i, canRemove) {
    var n = i + 1;
    return '<div class="act" data-i="' + i + '">' +
      '<div class="act-head"><span class="act-tag">' + esc(fmt(T("act"), { n: n })) + "</span>" +
      (canRemove ? '<button class="linklike" data-act="rm" data-i="' + i + '">' + esc(T("remove")) + "</button>" : "") + "</div>" +
      '<div class="q"><p class="stmt" id="lbl-a' + i + '">' + esc(T("aName")) + ' *</p><input type="text" data-act-i="' + i + '" data-k="n" maxlength="160" aria-labelledby="lbl-a' + i + '" placeholder="' + esc(T("aNamePh")) + '" value="' + esc(act.n || "") + '"></div>' +
      ACT_FIELDS.map(function (f) {
        return '<div class="q"><p class="stmt">' + tx(f.q) + " *</p>" + (f.help ? '<p class="help">' + esc(T(f.help)) + "</p>" : "") +
          choiceGroup("a" + i + "_" + f.k, T(f.o), act[f.k], false) + "</div>";
      }).join("") + "</div>";
  }

  function stepValid(step) {
    var a = state.a;
    if (step.acts) {
      return a.acts.length >= step.acts.lo && a.acts.every(function (x) {
        return filled((x.n || "").trim()) && ACT_FIELDS.every(function (f) { return x[f.k] != null; });
      });
    }
    return step.qs.every(function (q) {
      if (!q.req) return true;
      if (q.type === "agree") return Array.isArray(a[q.k]) && q.rows.every(function (_, i) { return a[q.k][i] != null; });
      if (q.type === "short" || q.type === "long") return filled((a[q.k] || "").trim());
      return filled(a[q.k]);
    });
  }

  function renderStep() {
    var steps = STEPS[FORM], step = steps[state.step], a = state.a;
    var segs = steps.map(function (_, i) { return '<div class="seg' + (i <= state.step ? " done" : "") + '"></div>'; }).join("");
    var body;
    if (step.acts) {
      var canRemove = a.acts.length > step.acts.lo;
      body = '<div class="s-head"><h2>' + esc(T(step.title)) + "</h2><p>" + esc(fmt(T(step.sub), step.acts)) + "</p><p>" + esc(T("actEx")) + "</p></div>" +
        a.acts.map(function (x, i) { return actCard(x, i, canRemove); }).join("") +
        '<div class="add-row">' + (a.acts.length < step.acts.hi ? '<button class="btn ghost small" data-act="add">' + esc(T("addAct")) + "</button>" : "") +
        '<span class="hint">' + esc(fmt(T("actsLeft"), { n: a.acts.length, hi: step.acts.hi })) + "</span></div>";
    } else {
      body = '<div class="s-head"><h2>' + tx(step.title) + "</h2></div>" + step.qs.map(function (q) { return qBlock(q, a); }).join("");
    }
    var last = state.step === steps.length - 1;
    $("app").innerHTML =
      '<section class="screen">' +
      '<div class="progress" aria-hidden="true"><div class="progress-steps">' + segs + '</div>' +
      '<div class="progress-note"><span>' + esc(fmt(T("stepOf"), { n: state.step + 1, t: steps.length })) + "</span><span>" + esc(ORG) + "</span></div></div>" +
      body +
      '<div class="nav-row"><button class="btn ghost" data-act="back">' + esc(T("back")) + "</button>" +
      '<span class="hint" id="nav-hint"></span>' +
      '<button class="btn" data-act="next" id="btn-next">' + esc(T(last ? "finish" : "next")) + "</button></div></section>";
    updateNext();
  }

  function updateNext() {
    var ok = stepValid(STEPS[FORM][state.step]);
    var b = $("btn-next");
    if (b) b.disabled = !ok;
    var h = $("nav-hint");
    if (h) h.textContent = ok ? "" : T("required");
  }

  // ---------- response code ----------
  function buildPayload() {
    var a = state.a, out = { v: 1, f: FORM, id: state.id, d: new Date().toISOString().slice(0, 10), l: lang };
    if (ORG) out.org = ORG;
    if (FORM === "t" && a.role != null) {
      var rl = roles();
      out.role = a.role < rl.length ? rl[a.role] : "";
    }
    Object.keys(a).forEach(function (k) {
      if (k === "role" || k === "acts") return;
      var v = a[k];
      if (typeof v === "string") v = v.trim();
      if (filled(v)) out[k] = v;
    });
    out.acts = a.acts.map(function (x) {
      var o = { n: (x.n || "").trim() };
      ACT_FIELDS.forEach(function (f) { o[f.k] = x[f.k]; });
      return o;
    });
    return out;
  }

  function renderDone() {
    var code = CODE_PREFIX + b64urlEncode(JSON.stringify(buildPayload()));
    var body = fmt(T("emailBody"), { org: ORG ? " (" + ORG + ")" : "", code: code });
    var mail = "mailto:" + encodeURIComponent(TO) + "?subject=" + encodeURIComponent(T("emailSubject") + (ORG ? " – " + ORG : "")) + "&body=" + encodeURIComponent(body);
    $("app").innerHTML =
      '<section class="screen">' +
      '<p class="eyebrow"><span class="mark">MR5</span> · ' + esc(T("doneEyebrow")) + "</p>" +
      "<h1>" + esc(T("doneTitle")) + "</h1>" +
      '<p class="lede">' + esc(T("doneLede")) + "</p>" +
      '<div class="card"><h3>' + esc(T("codeLabel")) + '</h3><div class="code-box" id="code">' + esc(code) + "</div>" +
      '<div class="btn-row"><a class="btn" href="' + esc(mail) + '">' + esc(T("email")) + '</a><button class="btn ghost" data-act="copy">' + esc(T("copy")) + "</button></div>" +
      '<p class="msg" id="copy-msg" role="status"></p></div>' +
      (FORM === "t" ? '<p class="notice">' + tx("doneAnon") + "</p>" : "") +
      '<div class="btn-row" style="margin-top:1.6rem"><button class="linklike" data-act="edit">' + esc(T("editAgain")) + "</button></div></section>";
  }

  function render() {
    if (VIEW === "facilitator") return renderFacilitator();
    if (!state || state.step < 0) renderIntro();
    else if (state.done) renderDone();
    else renderStep();
    $("foot").textContent = T("footer");
  }

  // ---------- events: survey ----------
  function onClick(e) {
    var t = e.target.closest("[data-act]");
    if (!t) return;
    var act = t.getAttribute("data-act");
    var steps = STEPS[FORM];
    if (act === "start" || act === "restart") {
      state = freshState(); state.id = rid(); state.step = 0; save(); render(); window.scrollTo(0, 0);
    } else if (act === "resume") {
      state = lsGet(STORE_KEY); if (!state.id) state.id = rid(); render(); window.scrollTo(0, 0);
    } else if (act === "back") {
      state.step -= 1; save(); render(); window.scrollTo(0, 0);
    } else if (act === "next") {
      if (!stepValid(steps[state.step])) return;
      if (state.step === steps.length - 1) state.done = true; else state.step += 1;
      save(); render(); window.scrollTo(0, 0);
    } else if (act === "add") {
      state.a.acts.push({}); save(); render();
      var cards = document.querySelectorAll(".act");
      var lastCard = cards[cards.length - 1];
      if (lastCard) { lastCard.scrollIntoView({ behavior: "smooth", block: "start" }); var inp = lastCard.querySelector("input[type=text]"); if (inp) inp.focus({ preventScroll: true }); }
    } else if (act === "rm") {
      state.a.acts.splice(+t.getAttribute("data-i"), 1); save(); render();
    } else if (act === "edit") {
      state.done = false; save(); render(); window.scrollTo(0, 0);
    } else if (act === "copy") {
      var code = $("code").textContent, msg = $("copy-msg");
      (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject())
        .then(function () { msg.textContent = T("copied"); }, function () { msg.textContent = T("copyFail"); });
    } else if (act === "f-read") {
      compileCodes();
    } else if (act === "f-csv-r") {
      download("responses.csv", respondentsCsv());
    } else if (act === "f-csv-a") {
      download("activities.csv", activitiesCsv());
    }
  }

  function onChange(e) {
    var el = e.target;
    if (VIEW === "facilitator") { if (el.closest("#f-links")) updateLinks(); return; }
    if (!state || state.step < 0 || state.done) return;
    var a = state.a, name = el.name || "";

    if (el.hasAttribute("data-act-i")) {
      a.acts[+el.getAttribute("data-act-i")].n = el.value;
    } else if (el.hasAttribute("data-k")) {
      a[el.getAttribute("data-k")] = el.value;
    } else if (/^a\d+_\w$/.test(name)) {
      var m = name.match(/^a(\d+)_(\w)$/);
      a.acts[+m[1]][m[2]] = +el.value;
    } else if (/_\d+$/.test(name)) {
      var p = name.match(/^(\w+)_(\d+)$/);
      var rowsLen = findQ(p[1]).rows.length;
      if (!Array.isArray(a[p[1]])) a[p[1]] = new Array(rowsLen).fill(null);
      a[p[1]][+p[2]] = +el.value;
    } else if (el.type === "checkbox") {
      var q = findQ(name);
      var arr = Array.isArray(a[name]) ? a[name].slice() : [];
      var v = +el.value, at = arr.indexOf(v);
      if (el.checked && at < 0) arr.push(v);
      if (!el.checked && at >= 0) arr.splice(at, 1);
      arr.sort(function (x, y) { return x - y; });
      a[name] = arr;
      var boxes = document.querySelectorAll('input[name="' + name + '"]');
      Array.prototype.forEach.call(boxes, function (b) { b.disabled = !b.checked && arr.length >= q.max; });
      if (q.other) {
        var oi = document.querySelector('[data-k="' + name + 'o"]');
        var on = arr.indexOf(T(q.o).length) >= 0;
        if (oi) { oi.hidden = !on; if (on && el.checked && v === T(q.o).length) oi.focus(); }
        if (!on) delete a[name + "o"];
      }
    } else if (el.type === "radio") {
      var qq = findQ(name);
      a[name] = qq && qq.type === "scale" ? +el.value + 1 : +el.value;
    }
    save(); updateNext();
  }

  function findQ(k) {
    var found = null;
    STEPS[FORM].forEach(function (s) { (s.qs || []).forEach(function (q) { if (q.k === k) found = q; }); });
    return found;
  }

  // ---------- facilitator view ----------
  var compiled = [];

  function renderFacilitator() {
    var langOpts = '<option value="en"' + (lang === "en" ? " selected" : "") + '>English</option><option value="fr"' + (lang === "fr" ? " selected" : "") + ">Français</option>";
    $("app").innerHTML =
      '<section class="screen">' +
      '<p class="eyebrow"><span class="mark">MR5</span> · ' + esc(T("fEyebrow")) + "</p>" +
      "<h1>" + esc(T("fTitle")) + "</h1>" +
      '<div class="card" id="f-links"><h3>' + esc(T("fLinks")) + '</h3><p class="sub">' + esc(T("fLinksSub")) + "</p>" +
      '<div class="field"><label for="f-org">' + esc(T("fOrg")) + '</label><input type="text" id="f-org" value="' + esc(ORG) + '"></div>' +
      '<div class="field"><label for="f-roles">' + esc(T("fRoles")) + '</label><textarea id="f-roles" rows="5">' + esc(roles().join("\n")) + "</textarea></div>" +
      '<div class="field"><label for="f-min">' + esc(T("fMin")) + '</label><input type="text" id="f-min" inputmode="numeric" value="' + MIN_GROUP + '"></div>' +
      '<div class="field"><label for="f-to">' + esc(T("fTo")) + '</label><input type="text" id="f-to" value="' + esc(TO) + '"></div>' +
      '<div class="field"><label for="f-lang">' + esc(T("fLang")) + '</label><select id="f-lang">' + langOpts + "</select></div>" +
      '<p class="stmt" style="font-weight:600;margin-top:1rem">' + esc(T("fTeamLink")) + '</p><div class="code-box" id="f-link-t"></div>' +
      '<p class="stmt" style="font-weight:600;margin-top:1rem">' + esc(T("fDirLink")) + '</p><div class="code-box" id="f-link-d"></div></div>' +
      '<div class="card"><h3>' + esc(T("fCompile")) + '</h3><p class="sub">' + esc(T("fCompileSub")) + "</p>" +
      '<textarea id="f-codes" rows="6" aria-label="' + esc(T("fPaste")) + '" placeholder="' + esc(T("fPaste")) + '"></textarea>' +
      '<div class="btn-row"><button class="btn" data-act="f-read">' + esc(T("fRead")) + "</button>" +
      '<button class="btn ghost" data-act="f-csv-r" id="f-csv-r" disabled>' + esc(T("fCsvR")) + "</button>" +
      '<button class="btn ghost" data-act="f-csv-a" id="f-csv-a" disabled>' + esc(T("fCsvA")) + "</button></div>" +
      '<p class="msg" id="f-msg" role="status"></p></div>' +
      '<div id="f-results"></div></section>';
    updateLinks();
    if (compiled.length) renderCompiled();
  }

  function updateLinks() {
    var base = location.origin + location.pathname;
    var p = new URLSearchParams();
    var org = $("f-org").value.trim(); if (org) p.set("org", org);
    var rl = $("f-roles").value.split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
    if (rl.length) p.set("roles", rl.join("|"));
    var mn = parseInt($("f-min").value, 10); if (mn && mn !== 5) p.set("min", mn);
    var to = $("f-to").value.trim(); if (to) p.set("to", to);
    p.set("lang", $("f-lang").value);
    var pt = new URLSearchParams(p); pt.set("form", "team");
    var pd = new URLSearchParams(p); pd.delete("roles"); pd.set("form", "direction");
    $("f-link-t").textContent = base + "?" + pt.toString();
    $("f-link-d").textContent = base + "?" + pd.toString();
  }

  function compileCodes() {
    var raw = $("f-codes").value.match(/AIA1\.[A-Za-z0-9_-]+/g) || [];
    var seen = {}, bad = 0, dup = 0;
    compiled.forEach(function (r) { seen[r.id] = true; });
    raw.forEach(function (c) {
      try {
        var r = JSON.parse(b64urlDecode(c.slice(CODE_PREFIX.length)));
        if (!r || r.v !== 1 || !Array.isArray(r.acts)) throw new Error("bad");
        if (seen[r.id]) { dup++; return; }
        seen[r.id] = true; compiled.push(r);
      } catch (e) { bad++; }
    });
    var nt = compiled.filter(function (r) { return r.f === "t"; }).length;
    $("f-msg").textContent = fmt(T("fFound"), { n: compiled.length, t: nt, d: compiled.length - nt, bad: bad, dup: dup });
    $("f-csv-r").disabled = $("f-csv-a").disabled = !compiled.length;
    renderCompiled();
  }

  // Decision tree, section 6.3 (proposal only — MR5 and leadership validate):
  // 1. serious consequence of an error → human to keep
  // 2. confidential data → augmented at most, pending data rules
  // 3. always the same way + minor consequence → automatable
  // 4. otherwise → augmented
  function classify(x) {
    if (x.e === 2) return "hum";
    if (x.c === 0 || x.c === 2) return "augData";
    if (x.s === 2 && x.e === 0) return "auto";
    return "aug";
  }
  var CAT_LABEL = { auto: "catAuto", aug: "catAug", augData: "catAugData", hum: "catHum" };

  function groupKey(r) { return r.f === "d" ? T("fLeaders") : (r.role || T("prefNot")); }

  function renderCompiled() {
    if (!compiled.length) { $("f-results").innerHTML = ""; return; }
    // Hours by role group, pooling team groups below the minimum size. Leadership
    // answers are named and reported without attribution, so they keep their own row.
    var groups = {};
    compiled.forEach(function (r) { var g = groupKey(r); (groups[g] = groups[g] || []).push(r); });
    var rows = [], pooled = [], leaders = T("fLeaders");
    Object.keys(groups).forEach(function (g) {
      if (g !== leaders) (groups[g].length >= MIN_GROUP ? rows : pooled).push([g, groups[g]]);
    });
    if (pooled.length) {
      var all = []; pooled.forEach(function (p) { all = all.concat(p[1]); });
      rows.push([fmt(T("fPooled"), { min: MIN_GROUP }), all]);
    }
    if (groups[leaders]) rows.push([leaders, groups[leaders], true]);
    var tableRows = rows.map(function (pair) {
      var h = { auto: 0, aug: 0, hum: 0 }, n = 0;
      pair[1].forEach(function (r) {
        r.acts.forEach(function (x) {
          var c = classify(x); n++;
          h[c === "augData" ? "aug" : c] += HOURS_MID[x.h] || 0;
        });
      });
      var tot = h.auto + h.aug + h.hum;
      var cell = pair[1].length < MIN_GROUP && !pair[2] ? function () { return '<td class="num muted">–</td>'; } : function (v) { return '<td class="num">' + v.toFixed(1) + "</td>"; };
      return "<tr><td>" + esc(pair[0]) + '</td><td class="num">' + pair[1].length + '</td><td class="num">' + n + "</td>" +
        cell(h.auto) + cell(h.aug) + cell(h.hum) + cell(tot) + "</tr>";
    }).join("");

    // Leadership vs teams on the shared lists.
    var teams = compiled.filter(function (r) { return r.f === "t"; });
    var dirs = compiled.filter(function (r) { return r.f === "d"; });
    function share(list, k, i) {
      if (!list.length) return '<td class="num muted">–</td>';
      var c = list.filter(function (r) { return Array.isArray(r[k]) && r[k].indexOf(i) >= 0; }).length;
      return '<td class="num">' + Math.round(100 * c / list.length) + " %</td>";
    }
    function cmpRows(k, optKey) {
      return T(optKey).map(function (o, i) { return "<tr><td>" + esc(o) + "</td>" + share(teams, k, i) + share(dirs, k, i) + "</tr>"; }).join("");
    }
    function changeAvg(list, idx) {
      var v = list.map(function (r) { return Array.isArray(r.ag) ? r.ag[idx] : null; }).filter(function (x) { return x != null && x < 5; });
      return v.length ? '<td class="num">' + (v.reduce(function (s, x) { return s + x + 1; }, 0) / v.length).toFixed(1) + "</td>" : '<td class="num muted">–</td>';
    }
    var head3 = "<tr><th>" + esc(T("fItem")) + '</th><th class="num">' + esc(T("fTeams")) + " (" + teams.length + ')</th><th class="num">' + esc(T("fDir")) + " (" + dirs.length + ")</th></tr>";

    $("f-results").innerHTML =
      '<div class="card"><h3>' + esc(T("fByRole")) + '</h3><p class="sub">' + esc(T("fByRoleSub")) + "</p>" +
      '<div class="tbl-scroll"><table><thead><tr><th>' + esc(T("fRole")) + '</th><th class="num">' + esc(T("fResp")) + '</th><th class="num">' + esc(T("fActs")) +
      '</th><th class="num">' + esc(T("fAuto")) + '</th><th class="num">' + esc(T("fAug")) + '</th><th class="num">' + esc(T("fHum")) + '</th><th class="num">' + esc(T("fTot")) +
      "</th></tr></thead><tbody>" + tableRows + "</tbody></table></div></div>" +
      '<div class="card"><h3>' + esc(T("fCompare")) + '</h3><p class="sub">' + esc(T("fCompareSub")) + "</p>" +
      '<div class="tbl-scroll"><table><thead>' + head3 + "</thead><tbody>" +
      '<tr><th colspan="3">' + esc(T("qReinvestT")) + "</th></tr>" + cmpRows("re", "reinvest") +
      '<tr><th colspan="3">' + esc(T("qConcernT")) + "</th></tr>" + cmpRows("co", "concerns") +
      "<tr><td>" + esc(T("fChangeAvg")) + "</td>" + changeAvg(teams, 2) + changeAvg(dirs, 1) + "</tr>" +
      "</tbody></table></div></div>";
  }

  function csvCell(v) {
    if (v == null) return "";
    var s = Array.isArray(v) ? v.join("; ") : String(v);
    return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function pick(optKey, v) {
    var opts = T(optKey);
    if (Array.isArray(v)) return v.map(function (i) { return i < opts.length ? opts[i] : T("other"); });
    return v == null ? "" : opts[v];
  }
  function respondentsCsv() {
    var cols = ["id", "form", "date", "lang", "org", "role_group", "name_title", "scope", "top_activities", "exclusions",
      "coverage", "hand_over", "keep", "agree_rekey", "agree_find", "agree_teams_welcome_change", "agree_change_supported",
      "reinvest", "reinvest_other", "ai_used", "ai_feeling_1_5", "concerns", "concerns_other", "concerns_text",
      "training", "training_other", "ai_tools", "ai_tools_which", "data_indicators", "obligations", "written_rules",
      "who_decides", "champion", "n_activities"];
    var lines = [cols.join(",")];
    compiled.forEach(function (r) {
      var ag = r.ag || [], t = r.f === "t";
      var agv = function (i) { return ag[i] == null ? "" : T("agree")[ag[i]]; };
      var row = [r.id, t ? "team" : "leadership", r.d, r.l, r.org, t ? r.role : "", r.nm, r.sc, r.top, r.ex,
        pick("cover", r.cov), r.give, r.keep,
        t ? agv(0) : "", t ? agv(1) : "", t ? "" : agv(0), t ? agv(2) : agv(1),
        pick("reinvest", r.re), r.reo, pick("used", r.ai), r.feel, pick("concerns", r.co), r.coo, r.cq,
        pick("train", r.tr), r.tro, pick("tools", r.tl), r.tlw, r.dt, r.ob, pick("rules", r.ru), r.who, r.ch, r.acts.length];
      lines.push(row.map(csvCell).join(","));
    });
    return lines.join("\n");
  }
  function activitiesCsv() {
    var cols = ["respondent_id", "form", "role_group", "activity_no", "activity", "hours_per_week_bracket", "hours_per_week_estimate",
      "same_way", "value", "error_consequence", "confidential", "wants_to_lighten", "proposed_category", "validated_category"];
    var lines = [cols.join(",")];
    compiled.forEach(function (r) {
      r.acts.forEach(function (x, i) {
        lines.push([r.id, r.f === "t" ? "team" : "leadership", groupKey(r), i + 1, x.n, pick("hours", x.h), HOURS_MID[x.h],
          pick("same", x.s), pick("value", x.v), pick("err", x.e), pick("conf", x.c), pick("lighten", x.w),
          T(CAT_LABEL[classify(x)]), ""].map(csvCell).join(","));
      });
    });
    return lines.join("\n");
  }
  function download(name, text) {
    var blob = new Blob(["﻿" + text], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  // ---------- language ----------
  function setLang(l) {
    lang = l;
    document.documentElement.lang = l;
    $("lang-en").classList.toggle("active", l === "en"); $("lang-en").setAttribute("aria-pressed", l === "en");
    $("lang-fr").classList.toggle("active", l === "fr"); $("lang-fr").setAttribute("aria-pressed", l === "fr");
    render();
  }
  $("lang-en").addEventListener("click", function () { if (lang !== "en") setLang("en"); });
  $("lang-fr").addEventListener("click", function () { if (lang !== "fr") setLang("fr"); });

  document.addEventListener("click", onClick);
  document.addEventListener("change", onChange);
  document.addEventListener("input", function (e) {
    if (e.target.matches("input[type=text], textarea")) onChange(e);
  });

  setLang(lang);
})();
</script>
</body>
</html>
